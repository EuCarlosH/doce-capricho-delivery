    tagPrecisao.style.display = 'none';
  }

  img.src = montarUrlMapaEstatico(lat, lng, mapaZoomAtual);
  atualizarBotoesZoomMapa();

  abrirModal('map-confirm-overlay');
}

function aplicarLocalizacaoConfirmada() {
  if (!mapaConfirmPendente) return;
  const { lat, lng, precisaoGps, comp } = mapaConfirmPendente;

  $('#cli-lat').value = lat;
  $('#cli-lng').value = lng;
  $('#cli-gps-precisao').value = precisaoGps ? Math.round(precisaoGps) : '';
  $('#cli-geo-origem').value = 'gps';

  if (comp) {
    // O mapa e a geocodificação são APENAS sugestão: nunca sobrescrevem dado digitado pelo cliente.
    // Rua, numero e bairro digitados sao a informacao oficial do pedido.
    if (comp.rua && !$('#cli-rua').value.trim()) $('#cli-rua').value = comp.rua;
    if (comp.numero && !$('#cli-numero').value.trim()) $('#cli-numero').value = comp.numero;
    if (comp.bairro && !$('#cli-bairro').value.trim()) $('#cli-bairro').value = comp.bairro;
    atualizarZonaSugerida();
    if (precisaoGps && precisaoGps > 60) {
      showToast('Local aproximado (±' + Math.round(precisaoGps) + 'm). Confirme numero e bairro.', 'warning');
    } else {
      showToast('Localização confirmada. Confirme numero e bairro — e o que vale na entrega.', 'success');
    }
  } else {
    atualizarZonaSugerida();
    showToast('Localização confirmada. Preencha rua, numero e bairro.', 'warning');
  }

  mapaConfirmPendente = null;
  fecharModal('map-confirm-overlay');
}

const btnMapaConfirmar = document.getElementById('btn-mapa-confirmar');
if (btnMapaConfirmar) btnMapaConfirmar.addEventListener('click', aplicarLocalizacaoConfirmada);

const btnMapaTentarNovo = document.getElementById('btn-mapa-tentar-novo');
if (btnMapaTentarNovo) {
  btnMapaTentarNovo.addEventListener('click', () => {
    mapaConfirmPendente = null;
    fecharModal('map-confirm-overlay');
    showToast('Sem problema. Toque em "Usar Localização Atual" de novo ou digite o endereço.', 'warning');
  });
}

if (btnGps) {
  btnGps.addEventListener('click', () => {
    if (!mbTokenConfigurado()) {
      showToast('Configuração de mapas pendente. Preencha o endereço manualmente.', 'warning');
      return;
    }
    if (!navigator.geolocation) {
      showToast('Seu navegador não suporta geolocalização.', 'error');
      return;
    }

    btnGps.disabled = true; btnGps.classList.add('loading');
    document.getElementById('btn-gps-label').textContent = 'Localizando...';

    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const precisaoGps = position.coords.accuracy || '';

      try {
        const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json`
          + `?access_token=${MAPBOX_TOKEN}&language=pt&country=br&types=address`;
        const ctrl = new AbortController();
        const tmr = setTimeout(() => ctrl.abort(), 8000);
        const resp = await fetch(url, { signal: ctrl.signal });
        clearTimeout(tmr);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        const data = await resp.json();

        const comp = (data.features && data.features.length) ? mbExtrairComponentes(data.features[0]) : null;
        abrirConfirmacaoMapa(lat, lng, precisaoGps, comp);
      } catch (err) {
        console.error('[MAPBOX] Falha na geocodificação reversa:', err);
        // Mesmo sem endereço legível, a coordenada exata do GPS ainda vale — o cliente
        // confirma no mapa e preenche rua/número/bairro na mão.
        abrirConfirmacaoMapa(lat, lng, precisaoGps, null);
      } finally {
        btnGps.disabled = false; btnGps.classList.remove('loading');
        document.getElementById('btn-gps-label').textContent = '📍 USAR LOCALIZAÇÃO ATUAL';
      }
    }, (error) => {
      btnGps.disabled = false; btnGps.classList.remove('loading');
      document.getElementById('btn-gps-label').textContent = '📍 USAR LOCALIZAÇÃO ATUAL';
      if (error.code === error.PERMISSION_DENIED) { showToast('Permissão de localização negada. Preencha rua, número e bairro.', 'error'); }
      else if (error.code === error.TIMEOUT) { showToast('O GPS demorou demais. Preencha o endereço manualmente.', 'warning'); }
      else { showToast('Não foi possível obter sua localização. Preencha o endereço manualmente.', 'error'); }
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);

function processarConfig(doc) {
  if(doc.exists) {
    configLoja = doc.data();
    if(!configLoja.itensEsgotados) configLoja.itensEsgotados = [];
    if(!configLoja.textoFuncionamento) configLoja.textoFuncionamento = "Quinta a Domingo, 18:30 às 23:00";
    if(!configLoja.statusLoja) { configLoja.statusLoja = configLoja.forcarFechamento ? 'pausado' : 'auto'; }
    
    const rodape = document.getElementById('footer-funcionamento');
    if(rodape) rodape.textContent = 'Atendimento: ' + configLoja.textoFuncionamento;
    
    const statusManual = configLoja.statusLoja || 'auto';
    
    if (!primeiraCargaPausa && (statusManual === 'pausado' || statusManual === 'esgotado') && lojaEstavaPausada === false) { 
        fecharModal('builder-overlay'); fecharModal('cart-overlay'); fecharModal('success-overlay'); 
        abrirModal('modal-aviso-pausa'); 
    }
    lojaEstavaPausada = (statusManual === 'pausado' || statusManual === 'esgotado'); primeiraCargaPausa = false;
    processarAvisoPopup(configLoja.avisoPopup);
    
    configsCarregadasDB = true; 
    verificarHorario(); renderCardapio(); atualizarEstoqueNoBuilder();   
  }
}

const AVISO_POPUP_STORAGE_KEY = 'dca_aviso_popup_visto';
let avisoPopupAgendadoId = null;

function destinoAvisoSeguro(destino) {
  const valor = String(destino || '').trim();
  return valor.startsWith('#') || /^https:\/\//i.test(valor) ? valor : '#cardapio';
}

function executarDestinoAviso(destino) {
  fecharModal('aviso-popup-overlay');
  const alvo = destinoAvisoSeguro(destino);

  setTimeout(() => {
    if (alvo === '#modal-promocoes') {
      abrirModal('modal-promocoes');
      return;
    }

    if (alvo.startsWith('#combo_')) {
      const comboId = alvo.slice(1);
      const combo = acharSabor(comboId);
      const indisponivel = Array.isArray(configLoja.itensEsgotados) && configLoja.itensEsgotados.includes(comboId);
      if (indisponivel) {
        showToast('Esta oferta está indisponível no momento.', 'warning');
      } else if (combo) {
        abrirBuilder([comboId]);
      }
      return;
    }

    if (alvo.startsWith('#')) {
      const elemento = document.querySelector(alvo);
      if (elemento) elemento.scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }

    window.location.href = alvo;
  }, 320);
}

function processarAvisoPopup(aviso) {
  const imagemValida = !!(aviso && aviso.imagem && /^https:\/\//i.test(aviso.imagem));
  if (!aviso || aviso.ativo !== true || !aviso.id || (!aviso.titulo && !imagemValida)) return;

  const id = String(aviso.id);
  if (localStorage.getItem(AVISO_POPUP_STORAGE_KEY) === id || avisoPopupAgendadoId === id) return;

  avisoPopupAgendadoId = id;
  bannerJaMostrado = true;

  const titulo = document.getElementById('aviso-popup-title');
  const descricao = document.getElementById('aviso-popup-desc');
  const botao = document.getElementById('aviso-popup-btn');
  const imagem = document.getElementById('aviso-popup-img');
  const imagemWrap = document.getElementById('aviso-popup-img-wrap');
  const conteudo = document.querySelector('#aviso-popup-box .aviso-popup-content');
  const caixa = document.getElementById('aviso-popup-box');
  const somenteImagem = aviso.somenteImagem === true && imagemValida;

  titulo.textContent = aviso.titulo || 'Divulgação Doce Capricho';
  titulo.style.display = aviso.titulo ? 'block' : 'none';
  descricao.textContent = aviso.descricao || '';
  descricao.style.display = aviso.descricao ? 'block' : 'none';
  botao.textContent = aviso.botaoTexto || 'VER NOVIDADE';
  botao.style.display = somenteImagem ? 'none' : 'block';
  botao.onclick = () => executarDestinoAviso(aviso.destino);
  caixa.classList.toggle('somente-imagem', somenteImagem);
  if (conteudo) conteudo.style.display = somenteImagem ? 'none' : 'block';

  if (imagemValida) {
    imagemWrap.style.display = 'flex';
    imagemWrap.classList.add('imagem-clicavel');
    imagemWrap.setAttribute('role', 'link');
    imagemWrap.setAttribute('tabindex', '0');
    imagemWrap.setAttribute('aria-label', aviso.titulo || 'Abrir divulgação');
    imagemWrap.onclick = () => executarDestinoAviso(aviso.destino);
    imagemWrap.onkeydown = evento => {
      if (evento.key === 'Enter' || evento.key === ' ') {
        evento.preventDefault();
        executarDestinoAviso(aviso.destino);
      }
    };
    imagem.style.display = 'block';
    imagem.alt = aviso.titulo || 'Divulgação Doce Capricho';
    imagem.onerror = () => { imagemWrap.style.display = 'none'; };
    imagem.src = aviso.imagem;
  } else {
    imagem.removeAttribute('src');
    imagemWrap.style.display = 'none';
    imagemWrap.classList.remove('imagem-clicavel');
    imagemWrap.removeAttribute('role');
    imagemWrap.removeAttribute('tabindex');
    imagemWrap.removeAttribute('aria-label');
    imagemWrap.onclick = null;
    imagemWrap.onkeydown = null;
  }

  const tentarAbrir = (tentativasRestantes) => {
    const outroModalAberto = document.querySelector('.modal-overlay.open');
    if (outroModalAberto && tentativasRestantes > 0) {
      setTimeout(() => tentarAbrir(tentativasRestantes - 1), 700);
      return;
    }

    localStorage.setItem(AVISO_POPUP_STORAGE_KEY, id);
    abrirModal('aviso-popup-overlay');
  };

  setTimeout(() => tentarAbrir(12), 900);
}
db.collection('configuracoes').doc('geral').onSnapshot(processarConfig, error => {

});

function processarEstatisticas(doc) {
  if(doc.exists) { const dados = doc.data(); if(dados && dados.sabores) { let max = 0; let idMax = null; for(const [id, count] of Object.entries(dados.sabores)) { if(count > max) { max = count; idMax = id; } } if(saborMaisPedido !== idMax) { saborMaisPedido = idMax; renderCardapio(); } } }
}
db.collection('configuracoes').doc('estatisticas').onSnapshot(processarEstatisticas, err => { console.warn('[STATS]', err.code); });
