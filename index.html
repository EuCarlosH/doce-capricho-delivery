<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="manifest.json">

<link rel="icon" type="image/png" href="icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
/* ... TODO O SEU CSS ANTERIOR CONTINUA EXATAMENTE IGUAL ATÉ AQUI ... */
:root { --gold: #D4AF37; --gold-dark: #AA8C2C; --bg-main: #0A0A0A; --bg-card: #121212; --text-main: #E0E0E0; --text-muted: #888888; --white: #FFFFFF; --whatsapp: #25D366; --danger: #E63946; --border-light: rgba(255,255,255,0.05); }
* { margin: 0; padding: 0; box-sizing: border-box; } html { scroll-behavior: smooth; }
body { background: var(--bg-main); color: var(--text-main); font-family: 'Montserrat', sans-serif; overflow-x: hidden; }
h1, h2, h3, h4, .brand-font { font-family: 'Cinzel', serif; }

nav.top-nav { position: fixed; top: 0; width: 100%; background: rgba(10,10,10,0.95); backdrop-filter: blur(15px); z-index: 1000; padding: 15px 0; border-bottom: 1px solid var(--border-light); }
.nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
.nav-logo-fallback { color: var(--gold); font-size: 18px; font-weight: 700; text-decoration: none; letter-spacing: 2px; }
.nav-links { display: flex; list-style: none; gap: 30px; align-items: center; }
.nav-links a, .nav-links button { color: var(--text-main); text-decoration: none; font-size: 11px; font-weight: 600; text-transform: uppercase; background: none; border: none; cursor: pointer; }
.status-badge { border: 1px solid var(--gold); color: var(--gold); padding: 6px 16px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.status-badge.fechado { border-color: var(--danger); color: var(--danger); }
.status-badge.pausado { border-color: #F59E0B; color: #F59E0B; background: rgba(245,158,11,0.1); }

.bottom-nav { display: none; }
#home { min-height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; padding: 100px 20px 40px; margin: 0 auto; max-width: 1200px; background: linear-gradient(to right, rgba(10,10,10,0.95) 0%, rgba(10,10,10,0.6) 50%, rgba(10,10,10,0.1) 100%), url('hero-bg.jpg') center/cover no-repeat; border-bottom: 1px solid var(--border-light); }
.hero-title { font-size: clamp(32px, 6vw, 56px); color: var(--gold); margin-bottom: 15px; letter-spacing: 2px; line-height: 1.2; }
.hero-subtitle { font-size: clamp(12px, 2vw, 14px); color: var(--text-main); line-height: 1.8; }
.section-container { max-width: 1200px; margin: 0 auto; padding: 60px 20px; }

.mode-toggle-area { display: flex; justify-content: center; margin-bottom: 50px; }
.mode-buttons { display: inline-flex; border: 1px solid rgba(212,175,55,0.3); border-radius: 30px; overflow: hidden; background: var(--bg-card); }
.mode-btn { padding: 12px 30px; background: transparent; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
.mode-btn[aria-pressed="true"] { background: rgba(212,175,55,0.1); color: var(--gold); }
.meio-banner { background: rgba(212,175,55,0.05); border: 1px solid rgba(212,175,55,0.3); border-radius: 8px; padding: 15px; margin-bottom: 40px; text-align: center; font-size: 13px; color: var(--gold); display: none; }
.meio-banner.show { display: block; }
.category-title { display: flex; align-items: center; font-size: 16px; color: var(--gold); margin: 40px 0 30px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }
.category-title::after { content: ""; flex: 1; height: 1px; background: rgba(212,175,55,0.3); margin-left: 20px; }

.grid-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
.card { background: var(--bg-card); border-radius: 8px; overflow: hidden; border: 1px solid var(--border-light); display: flex; flex-direction: column; transition: all 0.3s; }
.card.selecionada { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.card-img-wrap { width: 100%; height: 200px; background: #1A1A1A; overflow: hidden; }
.card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; opacity: 0.9; }
.card-content { padding: 20px; display: flex; flex-direction: column; flex-grow: 1; }
.card-title { font-size: 15px; color: var(--white); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; }
.card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 25px; flex-grow: 1; }
.card-bottom { display: flex; justify-content: space-between; align-items: center; }
.card-price-text { font-weight: 700; color: var(--gold); font-size: 15px; }
.btn-add { background: transparent; border: 1px solid rgba(212,175,55,0.5); color: var(--gold); width: auto; min-width: 34px; height: 34px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0 10px; }

/* CSS PARA PRODUTO ESGOTADO */
.card.esgotado { opacity: 0.5; filter: grayscale(1); pointer-events: none; border-color: var(--border-light); }
.card.esgotado .btn-add { background: var(--border-light); color: var(--text-muted); border-color: transparent; font-size: 10px; font-weight: 700; text-transform: uppercase;}

/* CSS PARA LOJA PAUSADA/FECHADA (impede cliques gerais no cardápio) */
body.loja-fechada #cardapio { opacity: 0.6; pointer-events: none; }

.extras-table { width: 100%; border-collapse: collapse; background: var(--bg-card); border-radius: 8px; border: 1px solid var(--border-light); margin-top: 10px; }
.extras-table th, .extras-table td { padding: 15px 20px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border-light); }
.extras-table th { color: var(--gold); text-transform: uppercase; } .extras-table td { color: var(--text-main); }
.extras-table td:last-child { text-align: right; color: var(--gold); font-weight: 600; }

.cart-floating-btn { position: fixed; bottom: 30px; right: 30px; background: var(--gold); color: var(--bg-main); width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; z-index: 999; border: none; }
.cart-count { position: absolute; top: -5px; right: -5px; background: var(--danger); color: #fff; font-size: 11px; font-weight: 700; min-width: 22px; height: 22px; border-radius: 11px; display: none; align-items: center; justify-content: center; border: 2px solid var(--bg-main);}
.cart-count.show { display: flex; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 3000; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal-box { background: var(--bg-card); width: 100%; max-width: 500px; border-radius: 12px; padding: 30px; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid var(--border-light); }
.close-modal { position: absolute; top: 15px; right: 20px; font-size: 26px; cursor: pointer; color: var(--text-muted); border: none; background: none; }
.modal-box h2 { color: var(--gold); margin-bottom: 25px; border-bottom: 1px solid var(--border-light); padding-bottom: 15px; font-size: 18px; }

/* ... resto das classes modais (mantidas) ... */
.builder-group { margin-bottom: 20px; border: none; }
.builder-label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
.builder-base { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-main); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px dashed var(--border-light); }
.builder-base strong { color: var(--gold); font-size: 15px; font-weight: 700; }
.builder-group select, .builder-group textarea { width: 100%; padding: 14px; border: 1px solid var(--border-light); border-radius: 6px; background: var(--bg-main); color: var(--text-main); font-family: inherit; font-size: 13px; margin-bottom: 10px; }
.extra-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-light); border-radius: 8px; margin-bottom: 8px; }
.extra-row.checked { border-color: rgba(212,175,55,0.5); }
.extra-row label { display: flex; align-items: center; gap: 12px; cursor: pointer; font-size: 13px; flex: 1; }
.extra-price { color: var(--gold); font-weight: 600; font-size: 13px; margin-left: 10px; }
.extra-sub-select { width: 100%; margin-top: 12px; padding: 12px; background: var(--bg-main); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 6px; font-size: 12px; display: none; }
.extra-row.checked .extra-sub-select { display: block; }
.qty-row { display: flex; align-items: center; gap: 15px; }
.qty-btn { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border-light); background: transparent; color: var(--text-main); font-size: 18px; cursor: pointer; }
.qty-val { font-size: 16px; font-weight: 700; min-width: 24px; text-align: center; }
.cart-total-line { display: flex; justify-content: space-between; font-size: 16px; font-weight: 700; color: var(--text-main); margin-top: 10px; padding-top: 15px; border-top: 1px dashed var(--border-light); }
.btn-add-modal { background: var(--gold); color: var(--bg-main); border: none; padding: 15px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; text-transform: uppercase; font-size: 12px; margin-top: 20px; }
.cart-items-list { list-style: none; margin-bottom: 15px; }
.cart-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--border-light); }
.cart-item-info strong { display: block; color: var(--white); font-size: 13px; }
.cart-item-info small { display: block; color: var(--text-muted); font-size: 11px; }
.cart-item-price { font-weight: 700; color: var(--gold); font-size: 13px; }
.remove-btn { background: none; border: none; color: var(--danger); font-size: 22px; cursor: pointer; padding: 0 5px; }
.checkout-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
.checkout-form input, .checkout-form select { width: 100%; padding: 14px; border: 1px solid var(--border-light); border-radius: 6px; background: var(--bg-main); color: var(--text-main); font-family: inherit; }
.btn-finish { background: var(--whatsapp); color: #fff; border: none; padding: 16px; border-radius: 6px; font-weight: 700; text-transform: uppercase; cursor: pointer; margin-top: 10px; }
footer { background: var(--bg-card); padding: 60px 20px; border-top: 1px solid var(--border-light); text-align: center; }
.footer-logo { color: var(--gold); }
@media (max-width: 768px) {
  .nav-links { display: none; } #home { padding-top: 100px; text-align: center; align-items: center; }
  .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10,10,10,0.98); backdrop-filter: blur(15px); border-top: 1px solid var(--border-light); z-index: 2000; justify-content: space-around; padding: 12px 0; }
  .bottom-nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-muted); font-size: 10px; font-weight: 600; cursor: pointer; background:none; border:none; gap:6px;}
  .bottom-nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; }
  .cart-floating-btn { bottom: 90px; right: 20px; width: 50px; height: 50px; } footer { padding-bottom: 120px; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="nav-container">
    <a href="#home" class="nav-logo-fallback brand-font">DOCE CAPRICHO ATELIER</a>
    <ul class="nav-links">
      <li><a href="#home">Início</a></li>
      <li><a href="#cardapio">Cardápio</a></li>
      <li><button type="button" id="btn-nav-order">Meus Pedidos</button></li>
    </ul>
    <div id="nav-status-badge" class="status-badge">ABERTO</div>
  </div>
</nav>

<header id="home">
  <h1 class="hero-title brand-font">O SABOR QUE<br>VOCÊ JÁ<br>CONHECE</h1>
  <p class="hero-subtitle">Alta gastronomia, artesanal e exclusiva.</p>
</header>

<section id="cardapio" class="section-container">
  <div class="mode-toggle-area">
    <div class="mode-buttons">
      <button type="button" class="mode-btn" id="btn-mode-inteira" aria-pressed="true" data-modo="inteira">Pizza Inteira</button>
      <button type="button" class="mode-btn" id="btn-mode-meio" aria-pressed="false" data-modo="meio">Meio a Meio</button>
    </div>
  </div>
  <div id="meio-banner" class="meio-banner"></div>
  <h3 class="category-title brand-font">Sabores Tradicionais</h3>
  <div class="grid-menu" id="grid-tradicionais"></div>
  <h3 class="category-title brand-font" style="margin-top: 60px;">Sabores Premium</h3>
  <div class="grid-menu" id="grid-premium"></div>
</section>

<footer><h2 class="footer-logo brand-font">DOCE CAPRICHO ATELIER</h2></footer>

<nav class="bottom-nav">
  <a href="#home" class="bottom-nav-item"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Início</span></a>
  <a href="#cardapio" class="bottom-nav-item"><svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg><span>Menu</span></a>
  <button type="button" class="bottom-nav-item" id="btn-bottom-order">
    <div style="position: relative;"><svg viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg><span class="cart-count bottom-nav-count" id="bottom-cart-count">0</span></div>
    <span>Pedidos</span>
  </button>
</nav>

<button class="cart-floating-btn" id="btn-cart-float">🛒<span class="cart-count" id="cart-count">0</span></button>

<div class="modal-overlay" id="builder-overlay"><div class="modal-box"><button class="close-modal" data-close="builder-overlay">&times;</button><h2 id="builder-title" class="brand-font">Montar Pizza</h2><form id="builder-form"><div class="builder-base"><span>Valor base</span><strong id="builder-base-valor">R$ 0,00</strong></div><fieldset class="builder-group"><span class="builder-label">Adicionais</span><div id="builder-extras"></div></fieldset><div class="builder-group"><label class="builder-label">Observações</label><textarea id="builder-obs" maxlength="200"></textarea></div><div class="builder-group" style="display:flex; justify-content:space-between;"><span class="builder-label">Qtd</span><div class="qty-row"><button type="button" class="qty-btn" id="qty-minus">−</button><span class="qty-val" id="qty-val">1</span><button type="button" class="qty-btn" id="qty-plus">+</button></div></div><div class="cart-total-line"><span>Subtotal</span><span id="builder-subtotal">R$ 0,00</span></div><button type="submit" class="btn-add-modal">Adicionar</button></form></div></div>

<div class="modal-overlay" id="cart-overlay"><div class="modal-box"><button class="close-modal" data-close="cart-overlay">&times;</button><h2 class="brand-font">Seu Pedido</h2><ul class="cart-items-list" id="cart-items-list"></ul><form class="checkout-form" id="checkout-form"><div><label>Nome</label><input type="text" id="cli-nome" required></div><div><label>WhatsApp</label><input type="tel" id="cli-telefone" required></div><div><label>Recebimento</label><select id="cli-tipo-pedido"><option value="Entrega">Entrega</option><option value="Retirada">Retirada</option></select></div><div id="box-endereco"><label>Endereço</label><input type="text" id="cli-endereco"></div><div><label>Pagamento</label><select id="cli-pagamento"><option value="PIX">PIX</option><option value="Dinheiro">Dinheiro</option><option value="Cartão">Cartão</option></select></div><button type="submit" class="btn-finish" id="btn-finish">Finalizar via WhatsApp</button></form></div></div>

<script>
const CONFIG = { whatsapp: '5585921440055', taxaEntrega: 300 };
const HORARIO = { inicioH: 18, inicioM: 30, fimH: 23, fimM: 0 };
const FIREBASE_CONFIG = { apiKey: "AIzaSyCU5CFz3cbrpyk3dsJBR46m-0km3kYkjJA", authDomain: "sistema-doce-capricho.firebaseapp.com", projectId: "sistema-doce-capricho", storageBucket: "sistema-doce-capricho.firebasestorage.app", messagingSenderId: "203794333208", appId: "1:203794333208:web:4c4bc82f2ebb6032ab0d6d" };

const CARDAPIO = {
  tradicionais: [ { id:'mussarela', img:'mussarela.jpg', nome:'Mussarela', desc:'Molho, mussarela e tomate', preco:4500 }, { id:'mista', img:'mista.jpg', nome:'Mista', desc:'Molho, presunto e mussarela', preco:4500 }, { id:'frango', img:'frango.jpg', nome:'Frango', desc:'Molho, mussarela e frango', preco:4500 }, { id:'calabresa', img:'calabresa.jpg', nome:'Calabresa', desc:'Molho, mussarela, calabresa e cebola', preco:4500 }, { id:'carnesol', img:'carnedesol.jpg', nome:'Carne de Sol', desc:'Molho, mussarela, carne de sol', preco:4500 }, { id:'frangocat', img:'frangocatupiry.jpg', nome:'Frango com Catupiry', desc:'Molho, mussarela, frango e catupiry', preco:5500 } ],
  premium: [ { id:'nordestina', img:'nordestina.jpg', nome:'Nordestina', desc:'Molho, mussarela, cream cheese, carne de sol e coalho', preco:6000 }, { id:'lombo', img:'lombo.jpg', nome:'Lombo Canadense', desc:'Molho, lombo e catupiry', preco:7000 }, { id:'arretada', img:'arretada.jpg', nome:'Arretada', desc:'Molho, calabresa, coalho e bacon', preco:7000 }, { id:'peru', img:'peitodeperu.jpg', nome:'Peito de Peru', desc:'Molho, cream cheese, peito de peru, bacon', preco:7400 } ]
};

let lojaAberta = true;
let configLoja = { forcarFechamento: false, itensEsgotados: [] }; // Nova variável global

if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();

// OUVINTE DO FIREBASE (Lê as configurações do Admin)
db.collection('configuracoes').doc('geral').onSnapshot(doc => {
  if(doc.exists) {
    configLoja = doc.data();
    verificarHorario(); // Reavalia se a loja fechou
    renderCardapio();   // Re-desenha as pizzas (pinta as esgotadas de cinza)
  }
});

function verificarHorario() {
  const agora = new Date(); const tempoAtual = agora.getHours() * 60 + agora.getMinutes();
  const tempoInicio = HORARIO.inicioH * 60 + HORARIO.inicioM; const tempoFim = HORARIO.fimH * 60 + HORARIO.fimM;
  
  // A lógica nova: Se o admin pausou, ignora o relógio.
  if (configLoja.forcarFechamento === true) {
    lojaAberta = false;
  } else {
    lojaAberta = (tempoAtual >= tempoInicio && tempoAtual <= tempoFim);
  }
  atualizarStatusLoja();
}

function atualizarStatusLoja() {
  const badge = document.getElementById('nav-status-badge');
  if (!lojaAberta) {
    document.body.classList.add('loja-fechada');
    if(badge) {
      // Se fechou pelo botão do Admin, mostra PAUSADO
      if(configLoja.forcarFechamento) { badge.textContent = 'PAUSADO'; badge.className = 'status-badge pausado'; }
      // Se fechou pelo relógio, mostra FECHADO
      else { badge.textContent = 'FECHADO'; badge.className = 'status-badge fechado'; }
    }
  } else {
    document.body.classList.remove('loja-fechada');
    if(badge) { badge.textContent = 'ABERTO'; badge.className = 'status-badge'; }
  }
}
setInterval(verificarHorario, 60000); 

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const brl = c => (c / 100).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const todosSabores = () => [...CARDAPIO.tradicionais, ...CARDAPIO.premium];
const acharSabor = id => todosSabores().find(s => s.id === id);

let modo = 'inteira', meioSelecionado = null, carrinho = [], builder = null;

const cardHTML = s => {
  // Verifica se a pizza está na lista de esgotados do banco
  const isEsgotado = configLoja.itensEsgotados && configLoja.itensEsgotados.includes(s.id);
  const classeCard = isEsgotado ? 'card esgotado' : 'card';
  const textoBtn = isEsgotado ? 'Esgotado' : '+';

  return `
  <article class="${classeCard}" data-sabor="${s.id}">
    <div class="card-img-wrap"><img src="${s.img}" class="card-img"></div>
    <div class="card-content">
      <h4 class="card-title">${s.nome}</h4>
      <p class="card-desc">${s.desc}</p>
      <div class="card-bottom">
        <span class="card-price-text">${brl(s.preco)}</span>
        <button type="button" class="btn-add" ${isEsgotado ? 'disabled' : `data-escolher="${s.id}"`}>${textoBtn}</button>
      </div>
    </div>
  </article>`;
};

function renderCardapio() {
  $('#grid-tradicionais').innerHTML = CARDAPIO.tradicionais.map(cardHTML).join('');
  $('#grid-premium').innerHTML = CARDAPIO.premium.map(cardHTML).join('');
  atualizarBotoes();
}

function atualizarBotoes() {
  $$('[data-escolher]').forEach(btn => {
    const id = btn.dataset.escolher; const card = btn.closest('.card');
    if(card.classList.contains('esgotado')) return; // ignora botões esgotados
    card.classList.toggle('selecionada', meioSelecionado === id);
    if (meioSelecionado === id) btn.innerHTML = '✓'; else if (modo === 'meio' && meioSelecionado) btn.innerHTML = '2ª'; else btn.innerHTML = '+';
  });
}

function trocarModo(novo) { modo = novo; meioSelecionado = null; $('#btn-mode-inteira').setAttribute('aria-pressed', String(novo === 'inteira')); $('#btn-mode-meio').setAttribute('aria-pressed', String(novo === 'meio')); atualizarBotoes(); }

function escolherSabor(id) {
  if(!lojaAberta) { alert(configLoja.forcarFechamento ? "Nossa loja está pausada momentaneamente." : "Nossa loja está fechada no momento."); return; }
  if(configLoja.itensEsgotados && configLoja.itensEsgotados.includes(id)) return; // Trava de segurança
  
  if (modo === 'inteira') return abrirBuilder([id]);
  if (!meioSelecionado) { meioSelecionado = id; atualizarBotoes(); return; }
  if (meioSelecionado === id) { meioSelecionado = null; atualizarBotoes(); return; }
  const par = [meioSelecionado, id]; meioSelecionado = null; atualizarBotoes(); abrirBuilder(par);
}

function abrirBuilder(ids) {
  builder = { sabores: ids, qtd: 1 }; $('#builder-title').textContent = ids.length === 2 ? "Meio a Meio" : acharSabor(ids[0]).nome;
  $('#builder-base-valor').textContent = brl(ids.length === 2 ? (acharSabor(ids[0]).preco/2 + acharSabor(ids[1]).preco/2) : acharSabor(ids[0]).preco);
  $('#builder-overlay').classList.add('open');
}

$('#cardapio').addEventListener('click', e => { const b = e.target.closest('[data-escolher]'); if (b) escolherSabor(b.dataset.escolher); });
$$('.mode-btn').forEach(b => b.addEventListener('click', () => trocarModo(b.dataset.modo)));
$$('[data-close]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.close).classList.remove('open')));
$('#btn-cart-float').addEventListener('click', () => $('#cart-overlay').classList.add('open'));

renderCardapio();
</script>
</body>
</html>
