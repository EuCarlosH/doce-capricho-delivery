<!-- SCRIPT DE TEMA DINÂMICO E INTELIGENTE -->
<script>
  // 1. Função que lê o celular do cliente
  const getSystemTheme = () => window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  
  // 2. Função que apenas pinta a tela, sem forçar na memória
  const applyTheme = (theme) => {
    document.documentElement.setAttribute('data-theme', theme);
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0A0A0A' : '#F8F4EE');
  };

  // 3. Ao carregar a página: Verifica se o cliente já escolheu manualmente antes. Se não, usa o do celular.
  const savedTheme = localStorage.getItem('dca_theme_override');
  applyTheme(savedTheme || getSystemTheme());
  
  // 4. Fica "escutando" o celular. Se o cliente mudar o tema do aparelho, o site muda junto (desde que ele não tenha forçado no botão)
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
     if (!localStorage.getItem('dca_theme_override')) {
         applyTheme(e.matches ? 'dark' : 'light');
     }
  });
  
  // 5. O Botão manual: Se o cliente clicar, aí sim o site ignora o celular e salva a escolha dele para o futuro.
  const toggleTheme = () => {
    const currentTheme = document.documentElement.getAttribute('data-theme');
    const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    applyTheme(newTheme);
    localStorage.setItem('dca_theme_override', newTheme);
  };
</script>
