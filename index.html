  --text-main: #F4EFE9; --text-muted: #A3968A; 
  --danger: #FF6B5B; --warning: #FBBF24;
  --border-light: rgba(255,255,255,0.06); 
  --shadow-sm: 0 8px 24px rgba(0,0,0,0.4); 
  --shadow-md: 0 16px 40px rgba(0,0,0,0.6); 
  --img-bg: rgba(156, 166, 135, 0.12); --badge-bg: rgba(22, 18, 15, 0.85); --badge-text: #F4EFE9;
  --btn-grad-1: #E3B563; --btn-grad-2: #E3B563; --btn-grad-3: #E3B563; 
  --btn-grad-text: #241704; --btn-grad-shadow: rgba(227, 181, 99, 0.2);
  --cat-ornament: "—"; --cat-ornament-size: 13px; --cat-ornament-op: 0.6; --cat-ornament-color: var(--terracotta);
  --bottom-sheet-bg: rgba(0,0,0,0.8); --handle-bg: #3A2A20;
}

* { margin: 0; padding: 0; box-sizing: border-box; } html { scroll-behavior: smooth; }
body { background: var(--bg-main); color: var(--text-main); font-family: 'Work Sans', sans-serif; overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4, .brand-font { font-family: 'Fraunces', serif; font-weight: 600; } section, header { scroll-margin-top: 100px; }

.ripple { position: relative; overflow: hidden; }
.ripple::after { content: ""; display: block; position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; background-image: radial-gradient(circle, #fff 10%, transparent 10.01%); background-repeat: no-repeat; background-position: 50%; transform: scale(10, 10); opacity: 0; transition: transform .5s, opacity 1s; }
.ripple:active::after { transform: scale(0, 0); opacity: .3; transition: 0s; }
:root[data-theme="dark"] .ripple::after { background-image: radial-gradient(circle, var(--gold) 10%, transparent 10.01%); }

/* TOP NAV */
nav.top-nav { position: fixed; top: 0; width: 100%; z-index: 1000; padding: 15px 0; border-bottom: 1px solid var(--border-light); transition: top 0.4s var(--smooth), background-color 0.4s ease; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
:root[data-theme="light"] nav.top-nav { background: rgba(253, 251, 247, 0.85); } :root[data-theme="dark"] nav.top-nav { background: rgba(13, 10, 8, 0.85); border-bottom-color: transparent; box-shadow: 0 4px 30px rgba(0,0,0,0.3);}
.nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
.nav-logo-link { display: flex; align-items: center; text-decoration: none; }
.nav-logo-img { height: 34px; width: auto; display: block; }
.nav-logo-fallback { color: var(--text-main); font-size: 18px; font-weight: 700; text-decoration: none; letter-spacing: 1px; transition: color 0.3s ease;}
:root[data-theme="dark"] .nav-logo-fallback { color: var(--gold); }
.nav-links { display: flex; list-style: none; gap: 22px; align-items: center; margin-left:auto; } .nav-links a, .nav-links button { color: var(--text-main); text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 0.2px; background: none; border: none; cursor: pointer; } .nav-links a:hover, .nav-links button:hover { color: var(--gold); }
.nav-actions { display:flex; gap:12px; align-items:center; margin-left:auto; }
.desktop-brand-name { color:var(--text-main); font-family:'Fraunces',serif; font-size:15px; font-weight:600; letter-spacing:.4px; text-decoration:none; white-space:nowrap; }
:root[data-theme="dark"] .desktop-brand-name { color:var(--gold); }
.mobile-menu-toggle { display:none; width:40px; height:40px; padding:0; border:1px solid var(--border-light); border-radius:12px; background:var(--bg-card); color:var(--text-main); align-items:center; justify-content:center; cursor:pointer; box-shadow:var(--shadow-sm); }
.mobile-menu-toggle svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; transition:transform .3s var(--smooth); }
.mobile-menu-toggle[aria-expanded="true"] svg { transform:rotate(90deg); }

.status-badge { border: 1px solid transparent; background: var(--olive); color: #FFF; padding: 6px 16px; border-radius: 30px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
:root[data-theme="dark"] .status-badge { color: var(--bg-main); } .status-badge.fechado { background: transparent; border-color: var(--terracotta); color: var(--terracotta); } .status-badge.pausado { background: transparent; border-color: var(--gold); color: var(--gold-dark); }
:root[data-theme="dark"] .status-badge.fechado { color:#FF9A86; border-color:#C95E46; background:rgba(201,94,70,.12); }
:root[data-theme="dark"] .status-badge.pausado { color:#F2C96D; border-color:#B88A32; background:rgba(184,138,50,.12); }
.btn-install { display: none; background: rgba(221, 167, 58, 0.1); border: 1px solid var(--gold); color: var(--gold-dark); padding: 6px 12px; border-radius: 30px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
.theme-toggle { background: transparent; border: 1px solid var(--border-light); width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main); transition: all 0.3s ease;}
.theme-toggle:hover { background: var(--bg-card); box-shadow: var(--shadow-sm); }
.theme-toggle svg { width: 16px; height: 16px; stroke-linecap: round; stroke-linejoin: round; }
.theme-toggle .icon-sun { display:block; fill:none; stroke:currentColor; stroke-width:2; }
.theme-toggle .icon-moon { display:none; fill:currentColor; stroke:none; }
:root[data-theme="dark"] .theme-toggle .icon-moon { display:block; }
:root[data-theme="dark"] .theme-toggle .icon-sun { display:none; }
.bottom-nav { display: none; }

#home { min-height: 50vh; display:grid; grid-template-columns:minmax(0,.9fr) minmax(400px,1.1fr); align-items:center; gap:30px; text-align:left; padding:100px 20px 30px; margin:0 auto 20px; max-width:1200px; position:relative; overflow:hidden; background:var(--bg-main); border-radius:0 0 40px 40px; }
.hero-carousel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
.carousel-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transform: scale(1); transition: opacity 1.5s ease-in-out, transform 10s ease-out; }
.carousel-slide.active { opacity: 1; transform: scale(1.1); }
.hero-overlay { position: absolute; inset: 0; z-index: 1; background: linear-gradient(to bottom, rgba(253,251,247,0) 40%, rgba(253,251,247,1) 100%), linear-gradient(to right, rgba(253,251,247,0.95) 0%, rgba(253,251,247,0.6) 60%, rgba(253,251,247,0.1) 100%); transition: background 0.4s ease; }
:root[data-theme="dark"] .hero-overlay { background: linear-gradient(to bottom, rgba(13,10,8,0) 60%, rgba(13,10,8,1) 100%), linear-gradient(to right, rgba(13,10,8,0.95) 0%, rgba(13,10,8,0.7) 60%, rgba(13,10,8,0.1) 100%); }
.hero-content { position: relative; z-index: 2; }
.hero-brand-line { display:flex; align-items:center; gap:13px; margin-bottom:14px; }
.hero-brand-logo { width:54px; height:54px; flex:none; object-fit:cover; border-radius:14px; box-shadow:0 8px 24px rgba(86,42,20,.2); border:1px solid rgba(221,167,58,.28); }
.hero-eyebrow { display: block; color: var(--terracotta); font-size: 13px; font-weight: 600; letter-spacing: 0.4px; margin:0; }
.hero-title { font-size: clamp(28px, 4.5vw, 42px); color: var(--text-main); margin-bottom: 12px; letter-spacing: 1px; line-height: 1.15; max-width: 560px; }
.hero-subtitle { font-size: clamp(13px, 2vw, 15px); font-weight: 500; letter-spacing: 1px; color: var(--text-muted); max-width: 400px; line-height: 1.8; }
.hero-cta { display: inline-block; margin-top: 30px; padding: 18px 34px; border-radius: 14px; font-size: 13px; text-decoration: none; }
.hero-company-panel { position:relative; z-index:2; width:min(100%,510px); justify-self:end; padding:30px; border-radius:26px; color:#FFF8E9; background:linear-gradient(145deg,rgba(70,34,17,.97),rgba(139,58,43,.94) 55%,rgba(169,104,29,.92)); border:1px solid rgba(255,220,157,.2); box-shadow:0 24px 60px rgba(76,39,17,.2); overflow:hidden; }
.hero-company-panel::before { content:""; position:absolute; width:220px; height:220px; right:-90px; top:-110px; border-radius:50%; border:1px solid rgba(255,222,159,.2); box-shadow:0 0 0 28px rgba(255,222,159,.04),0 0 0 58px rgba(255,222,159,.025); pointer-events:none; }
.hero-panel-kicker { display:block; margin-bottom:9px; color:#F2C96D; font-size:9px; font-weight:800; letter-spacing:2px; text-transform:uppercase; }
.hero-company-panel h2 { position:relative; max-width:390px; margin:0 0 9px; color:#FFF8E9; font-size:clamp(21px,2.4vw,29px); line-height:1.22; }
.hero-panel-intro { position:relative; max-width:430px; margin:0 0 22px; color:rgba(255,248,233,.7); font-size:11px; line-height:1.65; }
.hero-trust-grid { position:relative; display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
.hero-trust-item { min-width:0; padding:13px 11px; border-radius:15px; background:rgba(255,255,255,.075); border:1px solid rgba(255,231,183,.1); backdrop-filter:blur(8px); }
.hero-trust-icon { width:30px; height:30px; display:grid; place-items:center; margin-bottom:9px; border-radius:9px; color:#F2C96D; background:rgba(242,201,109,.11); }
.hero-trust-icon svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.hero-trust-item strong { display:block; margin-bottom:4px; color:#FFF7E7; font-size:10px; line-height:1.3; }
.hero-trust-item small { display:block; color:rgba(255,248,233,.57); font-size:8px; line-height:1.45; }
:root[data-theme="dark"] .hero-company-panel { background:linear-gradient(145deg,#21120B,#4B2014 58%,#704117); box-shadow:0 28px 70px rgba(0,0,0,.45); }
@media (min-width:769px) and (max-width:980px) {
  #home { grid-template-columns:minmax(0,1fr) 330px; gap:18px; }
  .hero-company-panel { padding:23px 20px; }
  .hero-trust-grid { grid-template-columns:1fr; }
  .hero-trust-item { display:grid; grid-template-columns:30px 1fr; column-gap:9px; padding:10px; }
  .hero-trust-icon { grid-row:1 / span 2; margin:0; }
  .hero-trust-item strong { align-self:end; }
}

/* BALÃO DE DESTAQUES ROTATIVO (topo do cardápio) */
.promo-banner-inline { border-radius: 20px; padding: 28px 26px; margin: 0 0 40px; background: linear-gradient(135deg, var(--terracotta) 0%, var(--gold-dark) 100%); color: #FFF; position: relative; overflow: hidden; min-height: 130px; display: flex; flex-direction: column; justify-content: center; }
.promo-banner-eyebrow { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; opacity: 0.85; margin-bottom: 8px; }
.promo-banner-title { font-size: clamp(19px, 3vw, 26px); font-weight: 600; line-height: 1.3; max-width: 480px; }
.promo-banner-dots { display: flex; gap: 6px; margin-top: 18px; }
.promo-banner-dots button { width: 6px; height: 6px; border-radius: 50%; border: none; background: rgba(255,255,255,0.4); padding: 0; cursor: pointer; transition: all 0.3s var(--smooth); }
.promo-banner-dots button.active { width: 18px; border-radius: 4px; background: #FFF; }

/* TIRA "DESTAQUES" COM ADICIONAR RÁPIDO */
.destaques-header { display:flex; align-items:baseline; justify-content:flex-start; gap:14px; margin-bottom:4px; flex-wrap:wrap; }
.destaques-header span { font-size: 12px; color: var(--text-muted); font-weight: 600; }
.destaques-strip { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; padding:4px 0 14px; margin-bottom:18px; }
.destaques-strip::-webkit-scrollbar { display: none; }
.destaque-card { min-width:0; background:var(--bg-card); border:1px solid var(--border-light); border-radius:16px; overflow:hidden; box-shadow:var(--shadow-sm); transition:transform .3s var(--smooth),box-shadow .3s ease; }
.destaque-card:hover { transform: translateY(-4px); }
.destaque-card:hover { box-shadow:var(--shadow-md); }
.destaque-card .card-img-wrap { height:170px; }
.destaque-card .card-content { padding:15px 16px; }
.destaque-card .card-title { font-size:15px; margin-bottom:4px; }
.destaque-card .card-desc { display: none; }
.destaque-card .card-bottom { margin-top: 8px; }
.destaque-card .btn-add { width: 32px; height: 32px; font-size: 15px; border-radius: 9px; }

/* CHAMADA PARA AVALIAÇÃO NO GOOGLE */
.review-cta { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:var(--bg-card); border:1px dashed var(--border-light); border-radius:16px; padding:20px 24px; margin-bottom:22px; }
.review-cta strong { display: block; font-family: 'Fraunces', serif; font-size: 16px; color: var(--text-main); margin-bottom: 4px; }
.review-cta p { color: var(--text-muted); font-size: 13px; margin: 0; }
.review-cta a.btn-gradient { padding: 12px 22px; border-radius: 10px; font-size: 12px; text-decoration: none; white-space: nowrap; }
:root[data-theme="dark"] .hero-title, :root[data-theme="dark"] .hero-subtitle, :root[data-theme="dark"] .hero-eyebrow { text-shadow: 0 4px 20px rgba(0,0,0,0.9); }
:root[data-theme="dark"] .hero-title { color: var(--gold); }
:root[data-theme="dark"] .hero-subtitle { font-weight: 400; }

.section-container { max-width: 1200px; margin: 0 auto; padding: 20px 20px 60px; position: relative; }

.menu-intro { margin:0 auto 18px; text-align:center; }
.menu-intro span { display:block; margin-bottom:5px; color:var(--terracotta); font-size:9px; font-weight:800; letter-spacing:1.8px; text-transform:uppercase; }
.menu-intro h2 { margin:0 0 6px; color:var(--text-main); font-size:clamp(22px,2.4vw,30px); line-height:1.2; }
.menu-intro p { margin:0; color:var(--text-muted); font-size:12px; }

/* NOVA NAVEGAÇÃO "PILL" DAS CATEGORIAS (DESKTOP E MOBILE) */
.sticky-menu-wrapper { position:sticky; top:75px; z-index:900; background:rgba(255,255,255,.7); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); margin:0 auto 26px; padding:8px; border-radius:50px; border:1px solid var(--border-light); display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; transition:background-color .4s ease,box-shadow .4s ease; max-width:fit-content; box-shadow:var(--shadow-sm); }
:root[data-theme="dark"] .sticky-menu-wrapper { background: rgba(30, 25, 22, 0.6); border-color: rgba(255,255,255,0.05); }
.sticky-menu-wrapper::-webkit-scrollbar { display: none; }
.sticky-btn { white-space: nowrap; flex-shrink: 0; background: transparent; color: var(--text-muted); border: none; padding: 12px 24px; border-radius: 40px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; text-decoration: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
.sticky-btn:hover { color: var(--text-main); }
.sticky-btn.active { background: var(--bg-card); color: var(--gold-dark); box-shadow: 0 4px 15px rgba(0,0,0,0.05); } 
:root[data-theme="dark"] .sticky-btn:hover { color: var(--white); }
:root[data-theme="dark"] .sticky-btn.active { background: var(--bg-card); color: var(--gold); box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
.sticky-btn-promo { color: var(--terracotta); }
:root[data-theme="dark"] .sticky-btn-promo { color: var(--terracotta); }

.mode-toggle-area { display:flex; justify-content:center; margin:0 0 34px; }
.mode-buttons { display: inline-flex; border: 1px solid var(--border-light); border-radius: 40px; overflow: hidden; background: var(--bg-card); transition: all 0.3s ease; box-shadow: var(--shadow-sm); padding: 4px;} 
:root[data-theme="dark"] .mode-buttons { border-color: rgba(255,255,255,0.05); background: rgba(30, 25, 22, 0.6); }
.mode-btn { padding: 12px 30px; background: transparent; border: none; border-radius: 36px; color: var(--text-muted); font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.3s ease; }
.mode-btn[aria-pressed="true"] { background: rgba(221, 167, 58, 0.1); color: var(--gold-dark); } 
:root[data-theme="dark"] .mode-btn[aria-pressed="true"] { background: rgba(212, 175, 55, 0.15); color: var(--gold); }

.meio-banner { background: var(--bg-card); border: 1px dashed var(--gold); border-radius: 16px; padding: 20px; margin-bottom: 40px; text-align: center; font-size: 13px; color: var(--text-main); display: none; animation: fadeIn 0.4s var(--smooth); box-shadow: var(--shadow-sm);} 
:root[data-theme="dark"] .meio-banner { background: rgba(212,175,55,0.05); border-color: rgba(212,175,55,0.3); color: var(--gold); }
.meio-banner.show { display: block; }
.btn-link-cancel { background: none; border: none; color: var(--terracotta); text-decoration: underline; cursor: pointer; font-family: inherit; font-size: 12px; margin-left: 8px; transition: opacity 0.3s ease; font-weight: 700;} .btn-link-cancel:hover { opacity: 0.8; } :root[data-theme="dark"] .btn-link-cancel { color: var(--white); } :root[data-theme="dark"] .btn-link-cancel:hover { color: var(--gold); opacity: 1; }

#banner-pausado { display: none; background: rgba(230, 57, 70, 0.05); border: 1px dashed var(--terracotta); border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 40px; animation: slideDown 0.5s var(--smooth); } :root[data-theme="dark"] #banner-pausado { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.4); }
#banner-pausado h4 { color: var(--terracotta); margin-bottom: 10px; font-size: 18px; letter-spacing: 1px; } :root[data-theme="dark"] #banner-pausado h4 { color: var(--warning); }
#banner-pausado p { color: var(--text-main); font-size: 14px; line-height: 1.6; }

.category-title { display: flex; align-items: center; justify-content: flex-start; text-align: left; font-size: 21px; color: var(--text-main); margin: 60px 0 30px; letter-spacing: 0.3px; font-weight: 600; scroll-margin-top: 160px; } :root[data-theme="dark"] .category-title { color: var(--gold); }
.category-title::before { content: var(--cat-ornament); color: var(--cat-ornament-color); font-size: var(--cat-ornament-size); margin-right: 16px; opacity: var(--cat-ornament-op); line-height: 0; font-family: 'Work Sans', sans-serif; }

.grid-menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 35px; }
.card { background: var(--bg-card); border-radius: 14px; overflow: hidden; border: 1px solid var(--border-light); display: flex; flex-direction: column; transition: transform 0.4s var(--smooth), box-shadow 0.4s ease, border-color 0.4s ease; box-shadow: var(--shadow-sm); } 
:root[data-theme="dark"] .card { background: var(--bg-card); border-color: transparent; }
.card:hover { transform: translateY(-5px); box-shadow: var(--shadow-md); border-color: var(--gold); } 
:root[data-theme="dark"] .card:hover { border-color: rgba(212,175,55,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
.card.selecionada { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold); transform: scale(0.98); }

.card-img-wrap { width: 100%; height: 220px; background: var(--img-bg); overflow: hidden; display: flex; align-items: center; justify-content: center; position: relative; }
.skeleton-bg { background: linear-gradient(90deg, var(--bg-main) 0%, var(--bg-card) 50%, var(--bg-main) 100%); background-size: 200% 100%; animation: skeletonShimmer 1.5s infinite linear; }
:root[data-theme="dark"] .skeleton-bg { background: linear-gradient(90deg, #1A1A1A 0%, #2A2A2A 50%, #1A1A1A 100%); background-size: 200% 100%; }
@keyframes skeletonShimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

.card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s var(--smooth), opacity 0.4s ease; opacity: 0; z-index: 2; position: relative; }
.card-img.loaded { opacity: 1; }
.card:hover .card-img { transform: scale(1.05); } 
.card-img-wrap.error-img::before { content: '🍽️'; font-size: 40px; position: relative; z-index: 2; color: var(--text-muted); opacity: 0.5; }

.badges-container { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 4; align-items: flex-end; pointer-events: none; }
.badge-destaque { background: var(--badge-bg); color: var(--badge-text); border: 1px solid var(--border-light); padding: 6px 12px; border-radius: 8px; font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.badge-destaque.badge-top { background: var(--gold); color: #FFF; border-color: var(--gold); } :root[data-theme="dark"] .badge-destaque.badge-top { color: var(--bg-main); }

.card.esgotado { opacity: 0.6; filter: grayscale(1); pointer-events: none; border-color: var(--border-light); }
.card.esgotado .btn-add { background: var(--bg-main); color: var(--text-muted); border-color: var(--border-light); font-size: 10px; font-weight: 700; text-transform: uppercase; width: auto; padding: 0 12px; }
.card.esgotado .badges-container { display: none; } 
/* Loja fechada: cardápio segue 100% navegável e colorido. O bloqueio ocorre apenas no envio do pedido. */
body.loja-fechada #cardapio { opacity: 1; pointer-events: auto; }
#aviso-simulacao-checkout { display: none; background: rgba(230, 57, 70, 0.06); border: 1px dashed var(--terracotta); border-radius: 14px; padding: 16px; margin-bottom: 15px; text-align: center; }
#aviso-simulacao-checkout strong { display: block; color: var(--terracotta); font-size: 14px; margin-bottom: 6px; letter-spacing: 0.5px; }
#aviso-simulacao-checkout span { font-size: 12.5px; color: var(--text-muted); line-height: 1.6; }
:root[data-theme="dark"] #aviso-simulacao-checkout { background: rgba(245,158,11,0.08); border-color: rgba(245,158,11,0.4); }

.delivery-options { display: flex; gap: 15px; margin-bottom: 15px; margin-top: 5px; }
.delivery-card { flex: 1; border: 1px solid var(--border-light); border-radius: 16px; padding: 20px 10px; text-align: center; cursor: pointer; transition: all 0.3s var(--smooth); background: var(--bg-main); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; position: relative; overflow: hidden; } :root[data-theme="dark"] .delivery-card { background: rgba(255,255,255,0.02); border-color: transparent;}

.builder-group { margin-bottom: 25px; border: none; }
.builder-label { display: block; font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; font-weight: 700; } :root[data-theme="dark"] .builder-label { font-weight: 600; }

.combo-builder { display:none; margin-bottom:24px; }

.extra-row { display: flex; flex-direction: column; padding: 16px; background: var(--bg-main); border: 1px solid var(--border-light); border-radius: 12px; margin-bottom: 12px; transition: all 0.3s var(--smooth); } :root[data-theme="dark"] .extra-row { background: rgba(255,255,255,0.02); border-color: transparent;}
.extra-row.checked { border-color: rgba(221, 167, 58, 0.4); background: rgba(221, 167, 58, 0.05); } :root[data-theme="dark"] .extra-row.checked { border-color: rgba(212,175,55,0.4); background: rgba(212,175,55,0.05); }

.extra-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--gold-dark); cursor: pointer; flex-shrink: 0; } :root[data-theme="dark"] .extra-row input[type="checkbox"] { accent-color: var(--gold); }

.extra-options-grid { display: none; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; width: 100%; } .extra-row.checked .extra-options-grid { display: grid; animation: fadeIn 0.3s var(--smooth); }
.extra-opt-card { background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 8px; padding: 14px; text-align: center; font-size: 12px; color: var(--text-muted); cursor: pointer; transition: all 0.2s var(--smooth); display:flex; flex-direction: column; justify-content: center; align-items:center; gap:5px; } :root[data-theme="dark"] .extra-opt-card { background: rgba(255,255,255,0.02); border-color: transparent;}
.extra-opt-card:hover { border-color: rgba(221, 167, 58, 0.3); background: var(--bg-card);} :root[data-theme="dark"] .extra-opt-card:hover { border-color: rgba(212,175,55,0.3); }
.extra-opt-card:active { transform: scale(0.96); } .extra-opt-card.active { border-color: var(--gold); background: rgba(221, 167, 58, 0.08); color: var(--gold-dark); font-weight: 700; box-shadow: 0 2px 10px rgba(221,167,58,0.1);} :root[data-theme="dark"] .extra-opt-card.active { background: rgba(212,175,55,0.1); color: var(--gold); font-weight: inherit; box-shadow: none;}
.extra-opt-card span { font-weight: 700; line-height: 1.2; } .extra-opt-card small { font-size: 10px; opacity: 0.8; font-weight: 600; } :root[data-theme="dark"] .extra-opt-card small { font-weight: inherit; } .extra-opt-full { grid-column: span 2; } 

.qty-row { display: flex; align-items: center; gap: 15px; background: var(--bg-main); border: 1px solid var(--border-light); border-radius: 12px; padding: 4px;} :root[data-theme="dark"] .qty-row { background: rgba(255,255,255,0.02); border-color: transparent;}
.qty-btn { width: 36px; height: 36px; border-radius: 8px; border: none; background: transparent; color: var(--text-main); font-size: 20px; font-weight: 500; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: center;} :root[data-theme="dark"] .qty-btn { font-weight: 400; color: var(--white);}
.qty-btn:hover { color: var(--gold-dark); background: rgba(0,0,0,0.03);} :root[data-theme="dark"] .qty-btn:hover { color: var(--gold); background: rgba(255,255,255,0.05); }
.qty-btn:active { transform: scale(0.9); }
.qty-val { font-size: 16px; font-weight: 800; min-width: 30px; text-align: center; color: var(--text-main); display: inline-block; transition: color 0.2s ease;} :root[data-theme="dark"] .qty-val { font-weight: 700; color: var(--white);}
@keyframes popQty { 0% { transform: scale(1); } 50% { transform: scale(1.3); color: var(--gold); } 100% { transform: scale(1); color: var(--text-main); } } .qty-val.pop { animation: popQty 0.3s var(--smooth); }

.cart-total-line { display: flex; justify-content: space-between; font-size: 18px; font-weight: 800; color: var(--text-main); margin-top: 15px; padding-top: 20px; border-top: 1px dashed var(--border-light); transition: all 0.3s ease;} :root[data-theme="dark"] .cart-total-line { font-weight: 700; color: var(--white);}

.cart-sub-line { display: flex; justify-content: space-between; font-size: 14px; color: var(--text-muted); margin-bottom: 10px; font-weight: 600; transition: all 0.3s ease; } :root[data-theme="dark"] .cart-sub-line { font-weight: 500; }

.checkout-form { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }

.checkout-form input, .checkout-form select { width: 100%; padding: 16px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--bg-main); color: var(--text-main); font-family: inherit; font-size: 14px; transition: border-color 0.3s ease, box-shadow 0.3s ease; font-weight: 500;} :root[data-theme="dark"] .checkout-form input, :root[data-theme="dark"] .checkout-form select { font-weight: 400; background: rgba(255,255,255,0.02); border-color: transparent;}
.checkout-form input:focus, .checkout-form select:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px rgba(221, 167, 58, 0.15); background: var(--bg-card);} :root[data-theme="dark"] .checkout-form input:focus, :root[data-theme="dark"] .checkout-form select:focus { box-shadow: 0 0 0 3px rgba(212,175,55,0.15); background: var(--bg-card); }

.campo-hint { font-size: 11px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; font-weight: 500; display: block; }

/* === WIZARD DE PEDIDO (STEPPER: Itens / Recebimento / Pagamento / Revisão) === */
.stepper { display: flex; align-items: flex-start; justify-content: space-between; margin: 4px 0 28px; }
.stepper-step { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; z-index: 2; flex-shrink: 0; }
.stepper-icon { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-main); border: 2px solid var(--border-light); display: flex; align-items: center; justify-content: center; color: var(--text-muted); transition: all 0.3s var(--smooth); flex-shrink: 0; }
.stepper-icon svg { width: 15px; height: 15px; }
.stepper-label { font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); text-align: center; white-space: nowrap; transition: color 0.3s ease; }
.stepper-line { flex: 1 1 auto; height: 2px; background: var(--border-light); margin: 17px -2px 0; transition: background 0.4s ease; }
.stepper-step.active .stepper-icon { background: var(--gold); border-color: var(--gold); color: #FFF; box-shadow: 0 0 0 4px rgba(221, 167, 58, 0.15); }
.stepper-step.active .stepper-label { color: var(--gold-dark); }
.stepper-step.done .stepper-icon { background: var(--gold); border-color: var(--gold); color: #FFF; }
.stepper-step.done .stepper-label { color: var(--text-main); }
.stepper-line.done { background: var(--gold); }
:root[data-theme="dark"] .stepper-step.active .stepper-icon, :root[data-theme="dark"] .stepper-step.done .stepper-icon { color: var(--bg-main); }
:root[data-theme="dark"] .stepper-step.active .stepper-label { color: var(--gold); }
.pedido-step-panel { display: flex; flex-direction: column; gap: 15px; animation: fadeIn 0.3s ease; }
@media (max-width: 380px) {
  .stepper-icon { width: 30px; height: 30px; }
  .stepper-icon svg { width: 13px; height: 13px; }
  .stepper-label { font-size: 8px; }
  .stepper-line { margin-top: 14px; }
}

/* === INTEGRAÇÃO MAPBOX (autocomplete + GPS) === */
.btn-gps { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 15px; border-radius: 12px; border: 1px dashed var(--gold); background: rgba(221, 167, 58, 0.06); color: var(--gold-dark); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s var(--smooth); margin-bottom: 18px; }
:root[data-theme="dark"] .btn-gps { color: var(--gold); background: rgba(212,175,55,0.08); }
.btn-gps:hover:not(:disabled) { background: var(--gold); color: #FFF; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(221,167,58,0.25); }
:root[data-theme="dark"] .btn-gps:hover:not(:disabled) { color: var(--bg-main); }
.btn-gps:disabled { opacity: 0.6; cursor: wait; }
.btn-gps .gps-spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-top-color: transparent; animation: spin 0.7s linear infinite; display: none; }
.btn-gps.loading .gps-spinner { display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }

.mb-autocomplete-wrap { position: relative; }
.mb-suggestions { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--bg-card); border: 1px solid var(--border-light); border-radius: 14px; box-shadow: var(--shadow-md); z-index: 50; overflow: hidden; display: none; max-height: 260px; overflow-y: auto; }

    const def = EXTRAS.find(e => e.id === ex.id); if (!def) return false;
    if (def.tipo === 'fixo') { ex.aplicacao = 'toda'; ex.preco = def.preco; } else { if (!['metade', 'metade1', 'metade2', 'toda'].includes(ex.aplicacao)) return false; const pk = ex.aplicacao.startsWith('metade') ? 'metade' : 'toda'; ex.preco = def.precos[pk]; }
    ex.nome = def.nome; return true;
  });
  const ehPizza = item.sabores.every(id => !id.startsWith('esf_') && !id.startsWith('combo_'));
  if (ehPizza) {
    const bordaDef = BORDAS.find(b => b.id === (item.borda && item.borda.id)) || BORDAS[0];
    item.borda = { id:bordaDef.id, nome:bordaDef.nome, preco:bordaDef.preco };
  } else {
    item.borda = null;
  }
  item.base = precoBaseVal(item.sabores);
  item.unitario = item.base + item.extras.reduce((s, e) => s + e.preco, 0) + (item.borda ? item.borda.preco : 0);
  item.total = item.unitario * item.qtd;
  item.obs = String(item.obs || '').slice(0, 200);
  if (item.sabores[0] === 'combo_aniversariante' && !validarComboAniversariante(item.comboItens)) return false;
  return true;
}

function itemEsfihaRapida(id) {
  return carrinho.find(item => item.sabores.length === 1 && item.sabores[0] === id && !(item.extras || []).length && !(item.obs || '').trim() && !(item.comboItens || []).length);
}

function qtdEsfihaRapida(id) {
  const item = itemEsfihaRapida(id);
  return item ? item.qtd : 0;
}

function controleEsfihaHTML(id, esgotado) {
  if (esgotado) return '<button type="button" class="btn-add" disabled>Esgotado</button>';
  const qtd = qtdEsfihaRapida(id);
  return `<div class="esfiha-quick-control ${qtd ? 'active' : ''}" data-esfiha-control="${esc(id)}" aria-label="Quantidade no pedido">
    <button type="button" class="esfiha-quick-btn" data-esfiha-id="${esc(id)}" data-esfiha-delta="-1" aria-label="Diminuir quantidade" ${qtd ? '' : 'disabled'}>−</button>
    <span class="esfiha-quick-qty" data-esfiha-qty="${esc(id)}">${qtd}</span>
    <button type="button" class="esfiha-quick-btn" data-esfiha-id="${esc(id)}" data-esfiha-delta="1" aria-label="Adicionar uma unidade">+</button>
  </div>`;
}

const cardHTML = s => {
  const isEsgotado = configLoja.itensEsgotados && configLoja.itensEsgotados.includes(s.id);
  const classeCard = isEsgotado ? 'card esgotado' : 'card';
  let badges = [];
  if (s.id === 'peru' || s.id === 'nordestina' || s.id === 'esf_peru') { badges.push(`<span class="badge-destaque">👨‍🍳 Assinatura</span>`); }
  if (s.id === saborMaisPedido && !isEsgotado) { badges.push(`<span class="badge-destaque badge-top">✨ Mais Pedida</span>`); }
  let badgeHTML = badges.length ? `<div class="badges-container">${badges.join('')}</div>` : '';
  const controleCompra = s.id.startsWith('esf_')
    ? controleEsfihaHTML(s.id, isEsgotado)
    : `<button type="button" class="btn-add ripple" ${isEsgotado ? 'disabled' : `data-escolher="${s.id}"`}>${isEsgotado ? 'Esgotado' : '+'}</button>`;

  return `
  <article class="${classeCard}" data-sabor="${s.id}">
    <div class="card-img-wrap skeleton-bg">
      ${badgeHTML}
      <img src="${s.img}" alt="${esc(s.nome)}" class="card-img" onload="this.classList.add('loaded'); this.parentElement.classList.remove('skeleton-bg');" onerror="this.style.display='none'; this.parentElement.classList.remove('skeleton-bg'); this.parentElement.classList.add('error-img');">
    </div>
    <div class="card-content">
      <h4 class="card-title">${esc(s.nome)}</h4>
      <p class="card-desc">${esc(s.desc)}</p>
      <div class="card-bottom">
        <span class="card-price-text">${precoPromocionalHTML(s.preco, s.naoAcumulaDescontos === true, [s.id])}</span>
        ${controleCompra}
      </div>
    </div>
  </article>`;
};

function atualizarBotoes() {
  $$('[data-escolher]').forEach(btn => {

function abrirMontadorPizza() {
  montagemPizza = [];
  renderMontadorPizza();
  abrirModal('pizza-montador-overlay');
}

function renderMontadorPizza() {
  const preview = $('#pizza-montador-preview');
  const instrucao = $('#pizza-montador-instrucao');
  const confirmar = $('#pizza-montador-confirmar');
  if (!preview || !instrucao || !confirmar) return;
  const primeiro = montagemPizza[0] ? acharSabor(montagemPizza[0]) : null;
  const segundo = montagemPizza[1] ? acharSabor(montagemPizza[1]) : null;
  const lado = (sabor, classe, indice) => {
    const imagem = sabor ? imagemMontadorPizza(sabor) : '';
    const conteudo = sabor
      ? `${imagem ? `<img src="${esc(imagem)}" alt="">` : placeholderProdutoHTML('Imagem em preparação')}<span class="pizza-half-plus">Trocar</span>`
      : '<span class="pizza-half-plus" aria-hidden="true">+</span>';
    const rotulo = sabor ? `Trocar ${indice + 1}ª metade, atualmente ${sabor.nome}` : `Escolher sabor da ${indice + 1}ª metade`;
    return `<button type="button" class="pizza-preview-half pizza-half-choice ${classe} ${sabor ? 'filled' : ''}" data-pizza-lado="${indice}" aria-label="${esc(rotulo)}">${conteudo}</button>`;
  };
  preview.innerHTML = `
    <div class="pizza-preview-stage" aria-label="Montagem visual da pizza meio a meio">
      <div class="pizza-preview-fill">${lado(primeiro, 'left', 0)}${lado(segundo, 'right', 1)}</div>
      <div class="pizza-preview-crust"></div><div class="pizza-preview-divider"></div>
    </div>
    <div class="pizza-preview-legend">
      <div class="pizza-preview-flavor"><small>1ª metade</small><strong>${primeiro ? esc(primeiro.nome) : 'Escolha um sabor'}</strong></div>
      <div class="pizza-preview-flavor"><small>2ª metade</small><strong>${segundo ? esc(segundo.nome) : 'Escolha um sabor'}</strong></div>
    </div>
    ${primeiro && segundo ? `<div class="pizza-preview-price">½ ${esc(primeiro.nome)} (${brl(primeiro.preco / 2)}) + ½ ${esc(segundo.nome)} (${brl(segundo.preco / 2)}) = <strong>${brl(precoBaseVal(montagemPizza))}</strong></div>` : ''}`;
  instrucao.textContent = !primeiro ? 'Toque no + da primeira metade para escolher o sabor.' : !segundo ? 'Agora toque no + da segunda metade.' : 'Sabores escolhidos. Continue para selecionar a borda.';
  confirmar.disabled = !(primeiro && segundo);
}

function abrirSeletorSabor(lado) {
  ladoPizzaEmEdicao = Number(lado) === 1 ? 1 : 0;
  const etapa = $('#pizza-sabor-etapa');
  const instrucao = $('#pizza-sabor-instrucao');
  if (etapa) etapa.textContent = `Sabor ${ladoPizzaEmEdicao + 1}`;
  if (instrucao) instrucao.textContent = `Escolha o sabor da ${ladoPizzaEmEdicao + 1}ª metade.`;
  const esgotados = new Set(Array.isArray(configLoja.itensEsgotados) ? configLoja.itensEsgotados : []);
  const pizzas = [...CARDAPIO.tradicionais, ...CARDAPIO.premium];
  $('#pizza-flavor-picker').innerHTML = pizzas.map(sabor => {
    const indisponivel = esgotados.has(sabor.id);
    const selecionado = montagemPizza[ladoPizzaEmEdicao] === sabor.id;
    const categoria = CARDAPIO.premium.some(item => item.id === sabor.id) ? 'Premium' : 'Tradicional';
    return `<button type="button" class="pizza-flavor-option ${selecionado ? 'selected' : ''}" data-pizza-sabor="${sabor.id}" ${indisponivel ? 'disabled' : ''}>
      <img src="${esc(sabor.img)}" alt=""><span><strong>${esc(sabor.nome)}</strong><small>${esc(sabor.desc)}</small><small>${esc(categoria)} · <span class="pizza-flavor-price">${indisponivel ? 'Indisponível' : `Metade: ${brl(sabor.preco / 2)}`}</span></small></span><i class="pizza-flavor-radio" aria-hidden="true"></i>
    </button>`;
  }).join('');
  abrirModal('pizza-sabor-overlay');
}

function selecionarSaborMontador(id) {
  if (!acharSabor(id) || (configLoja.itensEsgotados || []).includes(id)) return;
  const outroLado = ladoPizzaEmEdicao === 0 ? 1 : 0;
  if (montagemPizza[outroLado] === id) {
    showToast('Escolha dois sabores diferentes. Para um único sabor, use Pizza Inteira.', 'warning');
    return;
  }
  montagemPizza[ladoPizzaEmEdicao] = id;
  fecharModal('pizza-sabor-overlay');
  renderMontadorPizza();
  if (montagemPizza[0] && montagemPizza[1]) {
    setTimeout(() => abrirFluxoBorda([...montagemPizza]), 320);
  }
}

function renderSeletorBorda() {
  const lista = $('#pizza-borda-list');
  if (!lista) return;
  lista.innerHTML = BORDAS.map(borda => `
    <button type="button" class="borda-option ${borda.id === bordaSelecionadaFluxo ? 'selected' : ''}" data-borda-id="${borda.id}">
      <strong>${esc(borda.nome)}</strong><small>${borda.preco ? `+ ${brl(borda.preco)}` : 'R$ 0,00'}</small>
    </button>`).join('');
}

function abrirFluxoBorda(ids, bordaAtual = null, retornarAoBuilder = false) {
  saboresParaBorda = [...ids];
  bordaSelecionadaFluxo = bordaAtual && BORDAS.some(b => b.id === bordaAtual.id) ? bordaAtual.id : 'sem_borda';
  bordaRetornoBuilder = retornarAoBuilder;
  renderSeletorBorda();
  abrirModal('pizza-borda-overlay');
}

function confirmarBordaPizza() {
  const borda = BORDAS.find(b => b.id === bordaSelecionadaFluxo) || BORDAS[0];
  fecharModal('pizza-borda-overlay');
  if (bordaRetornoBuilder && builder) {
    builder.borda = { ...borda };
    bordaRetornoBuilder = false;
    atualizarResumoBordaBuilder();
    atualizarBuilderTotal();
    return;
  }
  const saboresEscolhidos = [...saboresParaBorda];
  if ($('#pizza-montador-overlay').classList.contains('open')) fecharModal('pizza-montador-overlay');
  modo = 'inteira';
  meioSelecionado = null;
  $('#btn-mode-inteira').setAttribute('aria-pressed', 'true');
  $('#btn-mode-meio').setAttribute('aria-pressed', 'false');
  atualizarBanner();
  atualizarBotoes();
  setTimeout(() => abrirBuilder(saboresEscolhidos, borda), 320);
}

function trocarModo(novo) {
  modo = novo; meioSelecionado = null;
  $('#btn-mode-inteira').setAttribute('aria-pressed', String(novo === 'inteira'));
  $('#btn-mode-meio').setAttribute('aria-pressed', String(novo === 'meio'));
  atualizarBanner(); atualizarBotoes();
  if (novo === 'meio') abrirMontadorPizza();
}

function atualizarBanner() {
  const b = $('#meio-banner');
  if (modo !== 'meio') { b.classList.remove('show'); b.innerHTML = ''; return; }
  b.innerHTML = meioSelecionado ? `1ª metade: <strong>${esc(acharSabor(meioSelecionado).nome)}</strong>. Agora escolha a 2ª metade. <button type="button" class="btn-link-cancel ripple" id="btn-cancel-meio">trocar</button>` : 'Escolha o <strong>primeiro</strong> sabor. O valor final é a soma de cada metade.';
  b.classList.add('show'); const c = $('#btn-cancel-meio'); if (c) c.addEventListener('click', () => { meioSelecionado = null; atualizarBanner(); atualizarBotoes(); });
}

function escolherSabor(id) {
  // Loja fechada não impede a simulação: o cliente monta o pedido normalmente.
  if(configLoja.itensEsgotados && configLoja.itensEsgotados.includes(id)) return; 
  
  const isEsfihaOuCombo = id.startsWith('esf_') || id.startsWith('combo_');
  if (isEsfihaOuCombo) {
     if (meioSelecionado) { showToast("Não é possível misturar Pizza Meio-a-meio com Esfiha ou Combo.", "warning"); return; }
     fecharModal('modal-promocoes'); 
     return abrirBuilder([id]); 
  }

  if (modo === 'inteira') return abrirFluxoBorda([id]);
  abrirMontadorPizza();
}

function atualizarResumoBordaBuilder() {
  const resumo = $('#builder-borda-summary');
  const texto = $('#builder-borda-texto');
  if (!resumo || !texto || !builder) return;
  if (!builder.borda) {
    resumo.classList.remove('show');
    return;
  }
  texto.textContent = `${builder.borda.nome}${builder.borda.preco ? ` (+ ${brl(builder.borda.preco)})` : ''}`;
  resumo.classList.add('show');
}

function abrirBuilder(ids, borda = null) {
  if (ids[0] === 'combo_aniversariante') {
    const esgotados = Array.isArray(configLoja.itensEsgotados) ? configLoja.itensEsgotados : [];
    if (esgotados.includes('esf_choc_leite')) {
      showToast('O combo está temporariamente indisponível porque a esfiha de chocolate ao leite acabou.', 'warning');
      return;
    }
  }
  const ehPizza = !ids[0].startsWith('esf_') && !ids[0].startsWith('combo_');
  const bordaDef = ehPizza ? (BORDAS.find(b => b.id === (borda && borda.id)) || BORDAS[0]) : null;
  builder = { sabores: ids, qtd: 1, comboItens: [], borda: bordaDef ? { ...bordaDef } : null }; const nomes = ids.map(i => acharSabor(i).nome);
  const isCombo = ids[0].startsWith('combo_');
  const isEsfiha = ids[0].startsWith('esf_');
  
  $('#builder-title').textContent = ids.length === 2 ? `Meio a Meio: ${nomes.join(' / ')}` : nomes[0];
  renderPreviaPizza(ids);
  atualizarResumoBordaBuilder();
  const produtoBuilder = acharSabor(ids[0]);
  $('#builder-base-valor').innerHTML = precoPromocionalHTML(precoBaseVal(ids), produtoBuilder && produtoBuilder.naoAcumulaDescontos === true, ids);
  
  if (isEsfiha || isCombo) {
     $('#builder-extras-container').style.display = 'none';
     $('#builder-extras').innerHTML = '';
  } else {
     $('#builder-extras-container').style.display = 'block';
     $('#builder-extras').innerHTML = EXTRAS.map(e => {
        let cards = '';
        if (ids.length === 2) { cards = `<div class="extra-options-grid"><div class="extra-opt-card active" data-val="metade1"><span>Só na ${esc(nomes[0])}</span><small>+ ${brl(e.precos.metade)}</small></div><div class="extra-opt-card" data-val="metade2"><span>Só na ${esc(nomes[1])}</span><small>+ ${brl(e.precos.metade)}</small></div><div class="extra-opt-card extra-opt-full" data-val="toda"><span>Na Pizza Inteira</span><small>+ ${brl(e.precos.toda)}</small></div></div>`;
        } else { cards = `<div class="extra-options-grid"><div class="extra-opt-card active" data-val="metade"><span>Em Metade</span><small>+ ${brl(e.precos.metade)}</small></div><div class="extra-opt-card" data-val="toda"><span>Na Pizza Inteira</span><small>+ ${brl(e.precos.toda)}</small></div></div>`; }
        return `<div class="extra-row" data-id="${e.id}"><label class="extra-row-header"><div class="extra-title-area"><input type="checkbox" class="extra-chk" value="${e.id}"> <span class="extra-name-text">${esc(e.nome)}</span></div><span class="extra-price">+ Variável</span></label>${cards}</div>`;
    }).join('');
  }

  const comboContainer = $('#builder-combo-container');
  const qtyContainer = $('#builder-qty-container');
  if (ids[0] === 'combo_aniversariante') {
     comboContainer.style.display = 'block';
     qtyContainer.style.display = 'none';
     builder.comboItens = [{ id:'esf_choc_leite', qtd:1, categoria:'incluso' }];
     renderMontadorComboAniversariante();
  } else {
     comboContainer.style.display = 'none';
     comboContainer.innerHTML = '';
     qtyContainer.style.display = 'flex';
  }

  const labelObs = document.getElementById('label-obs');
  if (isCombo) {
     if (ids[0] === 'combo_aniversariante') {
       labelObs.innerHTML = 'Observações <span style="color:var(--text-muted); font-weight:500;">(opcional)</span>';
       $('#builder-obs').placeholder = 'Ex: retirar algum ingrediente de uma das esfihas...';
     } else {
       labelObs.innerHTML = 'Quais os sabores do Combo? <span style="color:var(--terracotta); font-weight:800;">*Obrigatório</span>';
       $('#builder-obs').placeholder = 'Digite aqui os sabores das pizzas/esfihas que acompanham...';
     }
  } else {
     labelObs.innerHTML = 'Observações';
     $('#builder-obs').placeholder = 'Ex: sem cebola, massa bem assada...';
  }

  $('#builder-obs').value = ''; $('#qty-val').textContent = '1'; 
  if(!isEsfiha && !isCombo) atualizarEstoqueNoBuilder(); 
  atualizarBuilderTotal();
  abrirModal('builder-overlay');
}

function qtdComboCategoria(categoria) {
  if (!builder || !Array.isArray(builder.comboItens)) return 0;
  return builder.comboItens.filter(i => i.categoria === categoria).reduce((s, i) => s + i.qtd, 0);
}

function opcoesComboDisponiveis(lista) {
  const esgotados = Array.isArray(configLoja.itensEsgotados) ? configLoja.itensEsgotados : [];
  return lista.filter(item => !esgotados.includes(item.id));
}

function linhasSaboresCombo(lista, categoria, limite) {

function renderMontadorComboAniversariante() {

  const esgotados = new Set(Array.isArray(configLoja.itensEsgotados) ? configLoja.itensEsgotados : []);

function alterarSaborCombo(id, categoria, delta) {
  if (!builder || builder.sabores[0] !== 'combo_aniversariante') return;
  const limite = categoria === 'tradicional' ? 10 : categoria === 'premium' ? 2 : 0;
  if (!limite || !acharSabor(id)) return;
  const total = qtdComboCategoria(categoria);
  let item = builder.comboItens.find(i => i.id === id && i.categoria === categoria);
  if (delta > 0 && total >= limite) return;
  if (!item && delta > 0) {
    builder.comboItens.push({ id, qtd:1, categoria });
  } else if (item) {
    item.qtd = Math.max(0, item.qtd + delta);
    if (item.qtd === 0) builder.comboItens = builder.comboItens.filter(i => i !== item);
  }
  renderMontadorComboAniversariante();
}

function validarComboAniversariante(comboItens, avisar = false) {
  const itens = Array.isArray(comboItens) ? comboItens : [];
  const soma = categoria => itens.filter(i => i.categoria === categoria).reduce((s, i) => s + (parseInt(i.qtd, 10) || 0), 0);
  const tradValidos = new Set(CARDAPIO.esfihas_tradicionais.map(i => i.id));
  const premiumValidos = new Set(CARDAPIO.esfihas_premium.filter(i => i.preco === 800).map(i => i.id));
  const estruturaValida = itens.every(i => Number.isInteger(i.qtd) && i.qtd > 0 && (
    (i.categoria === 'tradicional' && tradValidos.has(i.id)) ||
    (i.categoria === 'premium' && premiumValidos.has(i.id)) ||
    (i.categoria === 'incluso' && i.id === 'esf_choc_leite' && i.qtd === 1)
  ));
  const valido = estruturaValida && soma('tradicional') === 10 && soma('premium') === 2 && soma('incluso') === 1;
  if (!valido && avisar) {
    showToast(`Complete o combo: ${soma('tradicional')}/10 tradicionais e ${soma('premium')}/2 premium.`, 'warning');
  }
  return valido;
}

function detalhesComboTexto(item) {
  if (!item || !Array.isArray(item.comboItens)) return [];
  const agrupar = categoria => item.comboItens
    .filter(i => i.categoria === categoria)
    .map(i => `${i.qtd}× ${acharSabor(i.id)?.nome || i.id}`)
    .join(', ');
  const linhas = [];
  const tradicionais = agrupar('tradicional');
  const premium = agrupar('premium');
  const incluso = agrupar('incluso');
  if (tradicionais) linhas.push(`Tradicionais: ${tradicionais}`);
  if (premium) linhas.push(`Premium: ${premium}`);
  if (incluso) linhas.push(`Incluso: ${incluso}`);
  return linhas;
}

function saoItensIguais(itemA, itemB) {
    const strA = JSON.stringify({
        s: [...itemA.sabores].sort(),
        e: [...(itemA.extras || [])].sort((a,b) => a.id.localeCompare(b.id)).map(x => x.id + x.aplicacao),
        b: itemA.borda ? itemA.borda.id : '',
        o: (itemA.obs || "").trim(),
        c: [...(itemA.comboItens || [])].sort((a,b) => a.id.localeCompare(b.id)).map(x => `${x.categoria}:${x.id}:${x.qtd}`)
    });
    const strB = JSON.stringify({
        s: [...itemB.sabores].sort(),
        e: [...(itemB.extras || [])].sort((a,b) => a.id.localeCompare(b.id)).map(x => x.id + x.aplicacao),
        b: itemB.borda ? itemB.borda.id : '',
        o: (itemB.obs || "").trim(),
        c: [...(itemB.comboItens || [])].sort((a,b) => a.id.localeCompare(b.id)).map(x => `${x.categoria}:${x.id}:${x.qtd}`)
    });
    return strA === strB;
}

function adicionar() {
  if (builder.sabores[0] === 'combo_aniversariante' && !validarComboAniversariante(builder.comboItens, true)) {
      return;
  }
  if (builder.sabores[0].startsWith('combo_') && builder.sabores[0] !== 'combo_aniversariante' && $('#builder-obs').value.trim() === '') {
      showToast("Por favor, digite os sabores do combo nas observações.", "error");
      $('#builder-obs').focus();
      return;
  }
  
  const novoItem = { uid: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), sabores: builder.sabores, borda: builder.borda ? { ...builder.borda } : null, extras: lerExtras(), qtd: builder.qtd, obs: $('#builder-obs').value.trim(), comboItens: builder.comboItens ? builder.comboItens.map(i => ({...i})) : [] };
  if (!validarItem(novoItem)) return; 
  
  let itemExistente = carrinho.find(i => saoItensIguais(i, novoItem));
  if (itemExistente) {
      itemExistente.qtd = Math.min(20, itemExistente.qtd + novoItem.qtd);
      itemExistente.total = itemExistente.unitario * itemExistente.qtd;
  } else {
      carrinho.push(novoItem);
  }

  salvar(); atualizarUI(); 
  if (navigator.vibrate) navigator.vibrate(50);
  const cartBtn = $('#btn-cart-float'); if(cartBtn) { cartBtn.classList.remove('bump-anim'); void cartBtn.offsetWidth; cartBtn.classList.add('bump-anim'); }
  fecharModal('builder-overlay'); abrirModal('success-overlay');
}

function alterarEsfihaRapida(id, delta) {
  const sabor = acharSabor(id);
  if (!sabor || !id.startsWith('esf_') || !Number.isInteger(delta) || delta === 0) return;
  if ((configLoja.itensEsgotados || []).includes(id)) {
    showToast('Este sabor está indisponível no momento.', 'warning');
    return;
  }

  let item = itemEsfihaRapida(id);
  if (!item && delta > 0) {
    item = { uid:Date.now().toString(36) + Math.random().toString(36).slice(2,7), sabores:[id], extras:[], qtd:1, obs:'', comboItens:[] };
    if (!validarItem(item)) return;
    carrinho.push(item);
  } else if (item) {
    item.qtd = Math.max(0, Math.min(20, item.qtd + delta));
    if (item.qtd === 0) carrinho = carrinho.filter(i => i.uid !== item.uid);
    else item.total = item.unitario * item.qtd;
  } else {
    return;
  }

  salvar();
  atualizarUI();
  if (navigator.vibrate) navigator.vibrate(25);
}

window.mudarQtd = function(uid, delta) {
    let item = carrinho.find(i => i.uid === uid);
    if(!item) return;
    item.qtd += delta;
    if(item.qtd <= 0) {
        carrinho = carrinho.filter(i => i.uid !== uid);
    } else {
        item.qtd = Math.min(20, item.qtd);
        item.total = item.unitario * item.qtd;
    }
    salvar();
    atualizarUI();
};

window.removerDoCarrinho = function(uid) {
    carrinho = carrinho.filter(i => i.uid !== uid);

};

function irParaStep(n) {

  pedidoStepAtual = n;
  $$('.pedido-step-panel').forEach(p => { p.style.display = (parseInt(p.dataset.step, 10) === n) ? 'flex' : 'none'; });

  if (n === 4) montarRevisao();

function atualizarStepperUI() {
  $$('#pedido-stepper .stepper-step').forEach(el => {

  const bruto = carrinho.reduce((s, i) => s + i.total, 0);
  const subtotalPromocional = carrinho.reduce((s, i) => s + valorItemComPromocao(i), 0);
  const desconto = bruto - subtotalPromocional;
  const descontoCupom = calcularDescontoCupom(subtotalPromocional);
  const subtotal = Math.max(0, subtotalPromocional - descontoCupom);
  let entrega = 0;
  if ($('#cli-tipo-pedido').value === 'Entrega' && carrinho.length) {
     const val = parseInt($('#cli-taxa-id').value, 10);
     if(!isNaN(val)) entrega = val;
  }
  return { bruto, desconto, descontoCupom, subtotalPromocional, subtotal, entrega, total: subtotal + entrega }; 
}

function parseValorReais(valor) {
  let texto = String(valor || '')
    .trim()
    .replace(/R\$/gi, '')
    .replace(/\s+/g, '')
    .replace(/[^0-9,.-]/g, '');

  if (!texto) return null;

  const ultimaVirgula = texto.lastIndexOf(',');
  const ultimoPonto = texto.lastIndexOf('.');

  if (ultimaVirgula > -1 && ultimoPonto > -1) {
    if (ultimaVirgula > ultimoPonto) texto = texto.replace(/\./g, '').replace(',', '.');
    else texto = texto.replace(/,/g, '');
  } else if (ultimaVirgula > -1) {
    texto = texto.replace(/\./g, '').replace(',', '.');
  } else if ((texto.match(/\./g) || []).length > 1) {
    texto = texto.replace(/\./g, '');
  }

  const reais = Number(texto);
  if (!Number.isFinite(reais) || reais < 0) return NaN;
  return Math.round((reais + Number.EPSILON) * 100);
}

function formatarTrocoDigitado() {
  const campo = $('#cli-troco');
  if (!campo || !campo.value.trim()) return;
  const centavos = parseValorReais(campo.value);
  if (Number.isFinite(centavos)) campo.value = (centavos / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

$('#cli-troco').addEventListener('blur', formatarTrocoDigitado);
$('#cli-troco').addEventListener('input', e => e.target.classList.remove('field-error'));

function validarTroco() {
  const campo = $('#cli-troco');
  if (!campo) return true;
  campo.classList.remove('field-error');

  if ($('#cli-pagamento').value !== 'Dinheiro' || campo.value.trim() === '') return true;

  const valorTroco = parseValorReais(campo.value);
  const totalPedido = totais().total;

  if (!Number.isFinite(valorTroco)) {
    campo.classList.add('field-error');
    showToast('Informe um valor válido para o troco.', 'error');
    campo.focus();
    return false;
  }

  if (valorTroco === totalPedido) {
    campo.classList.add('field-error');
    showToast(`Se você vai pagar o valor exato (${brl(totalPedido)}), não há troco. Deixe o campo em branco ou informe um valor maior.`, 'error');
    campo.focus();
    return false;
  }

  if (valorTroco < totalPedido) {
    campo.classList.add('field-error');
    showToast(`O valor para troco deve ser maior que o total do pedido (${brl(totalPedido)}).`, 'error');
    campo.focus();
    return false;
  }

  campo.value = (valorTroco / 100).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return true;
}

function tentarAvancarStep3() {
  if (!validarTroco()) return;
  irParaStep(4);
}

function validarCheckout() {
  const erros = []; 
  const nome = $('#cli-nome'), tel = $('#cli-telefone'), rua = $('#cli-rua'), num = $('#cli-numero'), bairro = $('#cli-bairro'); 
  [nome, tel, rua, num, bairro].forEach(c => { if(c) c.classList.remove('field-error') });
  const btnGpsClear = document.getElementById('btn-gps-localizacao');
  if (btnGpsClear) btnGpsClear.classList.remove('field-error');
  
  if (nome.value.trim().length < 3) { erros.push('Informe seu nome completo.'); nome.classList.add('field-error'); }
  const d = soDigitos(tel.value); if (d.length < 10 || d.length > 11) { erros.push('WhatsApp inválido (DDD + número).'); tel.classList.add('field-error'); }
  if ($('#cli-tipo-pedido').value === 'Entrega') {
    if (!$('#cli-lat').value || !$('#cli-lng').value || $('#cli-taxa-id').value === '') {
      erros.push('Confirme sua localização ou escolha uma sugestão de endereço para calcularmos a taxa de entrega.');
      const btnGpsEl = document.getElementById('btn-gps-localizacao');
      if (btnGpsEl) { btnGpsEl.classList.add('field-error'); btnGpsEl.style.animation = 'shake 0.4s ease'; setTimeout(() => { btnGpsEl.style.animation = ''; }, 500); }
    }
    if (rua.value.trim().length < 2) { erros.push('Informe a rua da entrega.'); rua.classList.add('field-error'); }
    const numVal = num.value.trim();
    if (numVal.length < 1) { erros.push('Informe o número da casa (ou escreva S/N).'); num.classList.add('field-error'); }
    else if (!/\d/.test(numVal) && !/^(s\/?n|sem\s*n[uúUÚ]mero)$/i.test(numVal)) { erros.push('Número inválido: informe o número da casa ou escreva "S/N".'); num.classList.add('field-error'); }
    if (bairro.value.trim().length < 2) { erros.push('Informe o seu bairro.'); bairro.classList.add('field-error'); }
  }
  if (!carrinho.length) { showToast('Adicione pelo menos um item ao carrinho.', 'error'); return false; }
  if (erros.length > 0) { showToast(erros[0], 'error'); }
  return erros.length === 0;
}

function gerarPixPayload(chave, nome, cidade, valorCentavos) { let cleanChave = chave.replace(/[\s.-]/g, ''); const cleanNome = nome.normalize("NFD").replace(/[\u0300-\u036f]/g, "").substring(0, 25).toUpperCase(); const cleanCidade = cidade.normalize("NFD").replace(/[\u0300-\u036f]/g, "").substring(0, 15).toUpperCase(); const strValor = (valorCentavos / 100).toFixed(2); const formatField = (id, value) => id + String(value.length).padStart(2, '0') + value; const gui = formatField('00', 'br.gov.bcb.pix'); const key = formatField('01', cleanChave); const merchantAccount = formatField('26', gui + key); let payload = formatField('00', '01') + merchantAccount + formatField('52', '0000') + formatField('53', '986') + formatField('54', strValor) + formatField('58', 'BR') + formatField('59', cleanNome) + formatField('60', cleanCidade) + formatField('62', formatField('05', '***')) + '6304'; let crc = 0xFFFF; for (let c = 0; c < payload.length; c++) { crc ^= payload.charCodeAt(c) << 8; for (let i = 0; i < 8; i++) { if ((crc & 0x8000) !== 0) crc = ((crc << 1) ^ 0x1021) & 0xFFFF; else crc = (crc << 1) & 0xFFFF; } } return payload + (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0'); }

// ------------------------------------------------------------------
// TRAVA DE INTEGRIDADE: revalida o carrinho contra a configuração atual
// antes de gravar o pedido. Protege contra itens que esgotaram enquanto
// o cliente montava o pedido e contra preços defasados vindos de cache.
// Retorna true apenas quando o pedido pode seguir sem alterações.
// ------------------------------------------------------------------
function revalidarPedido() {
  const esgotados = Array.isArray(configLoja.itensEsgotados) ? configLoja.itensEsgotados : [];
  const totalAntes = totais().total;

  const aprovados = [];
  const removidos = [];

  carrinho.forEach(item => {
    let rotulo = 'Um item do seu carrinho';
    try { rotulo = nomeItem(item); } catch (e) {}

    const idsDoItem = [...(item.sabores || []), ...(item.comboItens || []).map(ci => ci.id)];
    const saborProblema = idsDoItem.find(id => !acharSabor(id) || esgotados.includes(id));
    if (saborProblema) {
      const sab = acharSabor(saborProblema);
      removidos.push(sab ? sab.nome : rotulo);
      return;
    }

    // validarItem recalcula base, extras, unitário e total com os preços atuais.
    if (!validarItem(item)) { removidos.push(rotulo); return; }
    aprovados.push(item);
  });

  if (removidos.length > 0) {
    carrinho = aprovados;
    salvar(); atualizarUI();

    const lista = [...new Set(removidos)];
    const nomes = lista.slice(0, 2).join(' e ') + (lista.length > 2 ? ` e mais ${lista.length - 2}` : '');
    const plural = lista.length > 1;

    if (!carrinho.length) {
      showToast(`${nomes} ${plural ? 'esgotaram' : 'esgotou'} e seu carrinho ficou vazio. Escolha outros sabores.`, 'error');
      fecharModal('cart-overlay');
    } else {
      showToast(`${nomes} ${plural ? 'acabaram' : 'acabou'} de esgotar e ${plural ? 'saíram' : 'saiu'} do carrinho. Confira o pedido antes de enviar.`, 'error');
      irParaStep(1);
    }
    return false;
  }

  if (!carrinho.length) {
    showToast('Seu carrinho está vazio.', 'error');
    return false;
  }

  const totalDepois = totais().total;
  if (totalDepois !== totalAntes) {
    atualizarUI();
    irParaStep(4);
    showToast(`Os valores foram atualizados. Novo total: ${brl(totalDepois)}. Confirme para enviar.`, 'warning');
    return false;
  }

  return true;
}

    L.push(`*Bairro:* ${p.end_bairro}`);
    if (p.end_referencia) L.push(`*Referência:* ${p.end_referencia}`);
    if (p.end_regiao) L.push(`*Faixa automática da taxa:* ${p.end_regiao}`);
    if (p.end_distancia_km != null) L.push(`*Distância aproximada:* ${Number(p.end_distancia_km).toFixed(1).replace('.', ',')} km`);
    if (p.end_cidade) L.push(`*Cidade:* ${p.end_cidade}${p.end_estado ? ' / ' + p.end_estado : ''}`);
    if (p.end_lat && p.end_lng) {
      const prec = p.end_gps_precisao ? ` ±${p.end_gps_precisao}m` : '';
      L.push(`_Mapa só como referência${prec} (pode estar impreciso — vale o endereço acima):_ https://www.google.com/maps?q=${p.end_lat},${p.end_lng}`);
    }
    L.push('');
  }
  L.push(`*Pagamento:* ${p.forma_pagamento}`, '', '*ITENS*');
  p.itens.forEach((i, n) => {
    L.push(`${n + 1}) ${i.qtd}× ${i.nome} — ${brl(i.total_centavos)}`);
    const categorias = { tradicional:'Tradicionais', premium:'Premium', incluso:'Incluso' };
    Object.entries(categorias).forEach(([categoria, rotulo]) => {
      const escolhas = (i.combo_itens || []).filter(ci => ci.categoria === categoria).map(ci => `${ci.qtd}× ${ci.nome}`);
      if (escolhas.length) L.push(`    • ${rotulo}: ${escolhas.join(', ')}`);
    });
    if (i.borda) L.push(`    • ${i.borda.nome}${i.borda.preco_centavos ? ` — ${brl(i.borda.preco_centavos)}` : ''}`);
    i.extras.forEach(e => L.push(`    • ${e.nome} (${e.aplicacao}) — ${brl(e.preco_centavos)}`));
    if (i.obs) L.push(`    • Obs: ${i.obs}`);
  });
  if (p.desconto_centavos > 0) {
    L.push('', `Valor dos itens: ${brl(p.subtotal_bruto_centavos)}`);
    if (p.desconto_geral_centavos > 0) L.push(`Promoção geral${p.desconto_percentual ? ` (${p.desconto_percentual}%)` : ''}: - ${brl(p.desconto_geral_centavos)}`);
    if (p.desconto_cupom_centavos > 0) L.push(`Cupom ${p.cupom_codigo}: - ${brl(p.desconto_cupom_centavos)}`);
  }
  L.push('', `Subtotal: ${brl(p.subtotal_centavos)}`); if (p.taxa_centavos) L.push(`Taxa de entrega: ${brl(p.taxa_centavos)}`); L.push(`*TOTAL: ${brl(p.total_centavos)}*`);
  if (p.forma_pagamento.includes('PIX')) { const payload = gerarPixPayload(CONFIG.pixChave, CONFIG.pixNome, 'BRASIL', p.total_centavos); L.push('', `*CHAVE PIX (Celular/Telefone):*`, CONFIG.pixChave, '', `*PIX COPIA E COLA:*`, payload, '', `Por favor, envie o comprovante respondendo a esta mensagem.`); }
  return L.join('\n');
}

async function gravarFirestore(pedido) { 
  if (!CONFIG.usarFirebase || !window.firebase) return null; 
  try { 
    const ref = await db.collection('pedidos').add({ ...pedido, data_pedido: firebase.firestore.FieldValue.serverTimestamp() }); 
    try { 
      const increment = firebase.firestore.FieldValue.increment(1); let updates = {}; 
      pedido.itens.forEach(item => { if(item.sabores) { item.sabores.forEach(saborId => { updates[`sabores.${saborId}`] = increment; }); } }); 
      if (Object.keys(updates).length > 0) { await db.collection('configuracoes').doc('estatisticas').set(updates, { merge: true }); } 
    } catch(errStats) { console.warn('[STATS]', errStats.code); }
    return ref.id; 
  } catch (e) { 
    console.error('[PEDIDO] Falha ao gravar:', e.code, e.message);
    showToast('Não conseguimos registrar o pedido no sistema. Envie pelo WhatsApp e confirme com a loja.', 'error');
    return null; 
  } 
}

let unsubscribeRastreio = null;

const normStatus = s => String(s || '')
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')

function abrirRastreio() {
  const lastOrderId = localStorage.getItem('dca_last_order');
  if (!lastOrderId) { showToast("Você ainda não tem pedidos ativos.", "warning"); return; }

  const elDesc = document.getElementById('track-desc');
  document.getElementById('track-id').textContent = `Pedido #${lastOrderId.slice(-5).toUpperCase()}`;
  if (elDesc) elDesc.textContent = 'Conectando...';
  abrirModal('tracking-overlay');

  if (unsubscribeRastreio) { unsubscribeRastreio(); unsubscribeRastreio = null; }

  unsubscribeRastreio = db.collection('pedidos').doc(lastOrderId).onSnapshot(
    doc => {
      if (!doc.exists) {
        if (elDesc) elDesc.innerHTML = '<span style="color:var(--danger);font-weight:bold;">Pedido não encontrado. Fale com a loja no WhatsApp.</span>';
        return;
      }
      const dados = doc.data() || {};
      if (elDesc) elDesc.textContent = 'Acompanhe o status em tempo real';
      atualizarTimeline(dados.status, dados.tipo_entrega);
    },
    error => {
      console.error('[RASTREIO]', error.code, error.message);
      if (elDesc) elDesc.innerHTML = `<span style="color:var(--danger);font-weight:bold;">Falha ao conectar (${esc(error.code)}).</span>`;
    }
  );
}

function atualizarTimeline(status, tipoEntrega) {
  const txtRota = document.getElementById('track-text-rota');
  const txtRotaSpan = document.querySelector('#step-saiu .tl-content span');
  if (txtRota && txtRotaSpan) {
    if (tipoEntrega === 'Retirada') {
      txtRota.textContent = 'Pronto p/ Retirada 🛍️';
      txtRotaSpan.textContent = 'Te aguardamos na loja.';
    } else {
      txtRota.textContent = 'Em Rota 🛵';
      txtRotaSpan.textContent = 'Saiu para entrega.';
    }
  }

  const steps = ['step-novo', 'step-preparando', 'step-saiu', 'step-concluido'].map(id => document.getElementById(id));
  steps.forEach(el => { if (el) el.className = 'tl-step'; });

  const s = normStatus(status);
  const elDesc = document.getElementById('track-desc');

  if (s === 'cancelado') {
    if (steps[0]) steps[0].className = 'tl-step done';
    if (elDesc) elDesc.innerHTML = '<span style="color:var(--danger); font-weight:bold;">Pedido Cancelado ❌</span>';
    return;
  }

  let etapa = 0;
  if (['preparando', 'em preparo', 'na cozinha'].includes(s)) etapa = 1;
  else if (['saiu para entrega', 'em rota', 'pronto para retirada', 'pronto'].includes(s)) etapa = 2;
  else if (['concluido', 'entregue', 'finalizado'].includes(s)) etapa = 3;

  for (let i = 0; i < etapa; i++) if (steps[i]) steps[i].className = 'tl-step done';
  if (steps[etapa]) steps[etapa].className = (etapa === 3) ? 'tl-step done' : 'tl-step active';
}

// INTEGRAÇÃO MAPBOX — Autocompletar de endereço + GPS
// ==========================================================
// Troque pelo seu token público do Mapbox (painel > Access tokens > Default public token).
// Ele começa com "pk.eyJ...". Este token é seguro para expor no front-end.
const MAPBOX_TOKEN = 'pk.eyJ1IjoiY29udGF0b2Nhcmxvc2hlbnJpcXVlIiwiYSI6ImNtdHp1MDZ0dTB2M20yeHBtOGJwM204dmcifQ.A94mTT7uZaPS80wJAGbTjA';

// Centro aproximado de São Miguel/RN, usado para priorizar e limitar as buscas de endereço à região.
const MAPBOX_PROXIMIDADE = { lat: -6.2028, lng: -38.4947 };
// Caixa (bbox) que cobre a área da cidade e arredores, para não trazer resultados de outros estados.
const MAPBOX_BBOX = [-38.72, -6.42, -38.28, -5.99]; // [oeste, sul, leste, norte]

let mbDebounceTimer = null;
let mbUltimaBuscaId = 0;

// ==========================================================
// CÁLCULO DE DISTÂNCIA — zona sugerida a partir da loja
// ==========================================================
// Faixas e valores atuais da loja. A seleção é automática pela distância aproximada.
const ZONAS_DISTANCIA = [
  { taxa: '300', nome: 'Centro/Proximidades (2km)', kmMax: 2 },
  { taxa: '600', nome: 'Localidades Afastadas', kmMax: 6 },
  { taxa: '1000', nome: 'Zonas Extremas', kmMax: Infinity },
];

// Distância em linha reta (Haversine), em km, entre duas coordenadas.
function calcularDistanciaKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2
    + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function zonaPelaDistancia(km) {
  return ZONAS_DISTANCIA.find(z => km <= z.kmMax) || ZONAS_DISTANCIA[ZONAS_DISTANCIA.length - 1];
}

// Guarda a faixa e a distância calculadas para o pedido.
let zonaSugeridaAtual = null;
let distanciaEntregaKmAtual = null;

// Roda sempre que cli-lat/cli-lng mudam e preenche automaticamente a taxa.
function atualizarZonaSugerida() {
  const hint = document.getElementById('zona-distancia-hint');
  const descricao = document.getElementById('taxa-auto-descricao');
  const valor = document.getElementById('taxa-auto-valor');
  const lat = parseFloat($('#cli-lat').value);
  const lng = parseFloat($('#cli-lng').value);

  if (isNaN(lat) || isNaN(lng)) {
    zonaSugeridaAtual = null;
    distanciaEntregaKmAtual = null;
    $('#cli-taxa-id').value = '';
    $('#cli-taxa-nome').value = '';
    $('#cli-distancia-km').value = '';
    if (descricao) descricao.textContent = 'Confirme sua localização ou escolha uma sugestão de endereço.';
    if (valor) valor.textContent = '—';
    if (hint) hint.style.display = 'none';
    atualizarUI();
    return;
  }

  const km = calcularDistanciaKm(lat, lng, CONFIG.lojaLat, CONFIG.lojaLng);
  const zona = zonaPelaDistancia(km);
  zonaSugeridaAtual = zona;
  distanciaEntregaKmAtual = km;
  $('#cli-taxa-id').value = zona.taxa;
  $('#cli-taxa-nome').value = zona.nome;
  $('#cli-distancia-km').value = km.toFixed(2);
  if (descricao) descricao.textContent = `${zona.nome} · aproximadamente ${km.toFixed(1)} km da loja`;
  if (valor) valor.textContent = `+ ${brl(parseInt(zona.taxa, 10))}`;

  if (hint) {
    hint.style.display = 'block';
    hint.innerHTML = `📍 Distância aproximada: <strong>${km.toFixed(1)} km</strong> — taxa aplicada automaticamente.`;
  }
  atualizarUI();
}

function mbTokenConfigurado() {
  return MAPBOX_TOKEN && MAPBOX_TOKEN.indexOf('pk.') === 0;
}

async function mbBuscarEndereco(query) {
  const idBusca = ++mbUltimaBuscaId;
  const url = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(query)}.json`
    + `?access_token=${MAPBOX_TOKEN}`
    + `&autocomplete=true&limit=6&language=pt&country=br`
    + `&proximity=${MAPBOX_PROXIMIDADE.lng},${MAPBOX_PROXIMIDADE.lat}`
    + `&bbox=${MAPBOX_BBOX.join(',')}`
    + `&types=address,poi,place,neighborhood`;

  try {
    const ctrl = new AbortController();
    const tmr = setTimeout(() => ctrl.abort(), 8000);
    const resp = await fetch(url, { signal: ctrl.signal });
    clearTimeout(tmr);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (idBusca !== mbUltimaBuscaId) return; // resposta antiga, ignora
    mbRenderizarSugestoes(data.features || []);
  } catch (err) {
    console.error('[MAPBOX] Falha na busca de endereço:', err);
  }
}

function mbExtrairComponentes(feature) {
  // O Mapbox devolve o endereço todo formatado + um "context" com bairro/cidade/estado separados.
  const contexto = feature.context || [];
  let bairro = '';
  contexto.forEach(item => {
    if (item.id && item.id.indexOf('neighborhood') === 0) bairro = item.text;
    if (!bairro && item.id && item.id.indexOf('locality') === 0) bairro = item.text;
  });
  // "address" traz normalmente algo como "Rua X" em text e o número em address (quando existe).
  const rua = feature.text || '';
  const numero = feature.address || '';
  return { rua, numero, bairro, lat: feature.center ? feature.center[1] : '', lng: feature.center ? feature.center[0] : '' };
}

function mbRenderizarSugestoes(features) {
  const box = document.getElementById('mb-suggestions');
  if (!box) return;

  if (!features.length) {
    box.innerHTML = '<div class="mb-suggestion-empty">Nenhum endereço encontrado. Digite manualmente.</div>';
    box.classList.add('show');
    return;
  }

  box.innerHTML = features.map((f, idx) => {
    const partes = (f.place_name || '').split(',');
    const linha1 = partes[0] || f.text;
    const linha2 = partes.slice(1).join(',').trim();
    return `<div class="mb-suggestion-item" data-idx="${idx}"><strong>${esc(linha1)}</strong>${linha2 ? `<small>${esc(linha2)}</small>` : ''}</div>`;
  }).join('');

  box.classList.add('show');
  box.dataset.features = JSON.stringify(features);
}

function mbFecharSugestoes() {
  const box = document.getElementById('mb-suggestions');
  if (box) { box.classList.remove('show'); box.innerHTML = ''; }
}

function mbPreencherEndereco(comp) {
  $('#cli-rua').value = comp.rua || '';
  // Numero e bairro sao sugeridos apenas quando o cliente ainda nao digitou nada.
  if (comp.numero && !$('#cli-numero').value.trim()) $('#cli-numero').value = comp.numero;
  if (comp.bairro && !$('#cli-bairro').value.trim()) $('#cli-bairro').value = comp.bairro;
  if (comp.lat && comp.lng) { $('#cli-lat').value = comp.lat; $('#cli-lng').value = comp.lng; $('#cli-gps-precisao').value = ''; $('#cli-geo-origem').value = 'sugestao'; }
  atualizarZonaSugerida();
}

// Autocompletar: escuta o campo de rua e busca sugestões com debounce.
const inputRuaEl = document.getElementById('cli-rua');
if (inputRuaEl) {
  inputRuaEl.addEventListener('input', () => {
    // Digitar invalida apenas a coordenada vinda de sugestao de endereco.
    // A coordenada real do GPS permanece como referencia extra para o entregador.
    if ($('#cli-geo-origem').value !== 'gps') { $('#cli-lat').value = ''; $('#cli-lng').value = ''; $('#cli-geo-origem').value = ''; atualizarZonaSugerida(); }

    const valor = inputRuaEl.value.trim();
    clearTimeout(mbDebounceTimer);
    if (valor.length < 3) { mbFecharSugestoes(); return; }
    if (!mbTokenConfigurado()) { return; } // sem token, autocompletar fica desativado silenciosamente

    mbDebounceTimer = setTimeout(() => mbBuscarEndereco(valor), 400);
  });

  inputRuaEl.addEventListener('blur', () => {
    // Pequeno atraso para permitir o clique na sugestão antes de fechar a lista.
    setTimeout(mbFecharSugestoes, 200);
  });
}

function abrirConfirmacaoMapa(lat, lng, precisaoGps, comp) {
  mapaConfirmPendente = { lat, lng, precisaoGps, comp };
  mapaZoomAtual = 16;

  const img = document.getElementById('mapa-confirm-img');
  const loading = document.getElementById('mapa-confirm-loading');
