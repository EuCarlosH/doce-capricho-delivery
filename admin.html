<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Painel da Cozinha — Doce Capricho</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#F4F7FE;color:#2B3674;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

header{background:#fff;padding:16px 24px;box-shadow:0 4px 20px rgba(0,0,0,.05);display:flex;
  justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;z-index:10}
header h1{color:#A66C1E;font-size:20px;font-weight:700}
.header-right{display:flex;align-items:center;gap:14px;font-size:13px;color:#666;flex-wrap:wrap}
.badge-status{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#2A9D8F}
.dot.off{background:#E63946}
.btn-plain{background:#F4F7FE;border:1px solid #dfe6f5;color:#2B3674;padding:8px 14px;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer}
.btn-plain:hover{background:#e9eefb}

/* LOGIN */
#login-screen{flex-grow:1;display:flex;align-items:center;justify-content:center;padding:24px}
.login-box{background:#fff;padding:32px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.07);
  width:100%;max-width:380px}
.login-box h2{color:#A66C1E;font-size:20px;margin-bottom:6px}
.login-box p.sub{font-size:13px;color:#888;margin-bottom:22px}
.login-box label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.login-box input{width:100%;padding:14px;border:1px solid #e0e6f5;border-radius:10px;font-size:16px;margin-bottom:16px}
.login-box input:focus{outline:none;border-color:#A66C1E}
.login-box button{width:100%;padding:15px;background:#A66C1E;color:#fff;border:none;border-radius:10px;
  font-size:14px;font-weight:700;cursor:pointer}
.login-box button:disabled{background:#c9b18d;cursor:not-allowed}
.login-erro{color:#E63946;font-size:13px;margin-top:14px;display:none;line-height:1.5}
.login-erro.show{display:block}

/* KANBAN */
#painel{flex-grow:1;display:none;flex-direction:column;min-height:0}
.kanban-board{display:flex;gap:16px;padding:20px;flex-grow:1;overflow-x:auto;align-items:stretch;min-height:0}
.kanban-col{background:#fff;flex:1 0 300px;max-width:380px;border-radius:16px;padding:16px;display:flex;
  flex-direction:column;box-shadow:0 4px 15px rgba(0,0,0,.03);min-height:0}
.kanban-col h2{font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  padding-bottom:12px;border-bottom:2px solid #F4F7FE;margin-bottom:12px;display:flex;
  justify-content:space-between;align-items:center;flex-shrink:0}
.col-content{overflow-y:auto;display:flex;flex-direction:column;gap:14px;flex-grow:1;min-height:0}
.col-novo h2{color:#E63946;border-bottom-color:#E63946}
.col-prep h2{color:#F4A261;border-bottom-color:#F4A261}
.col-entrega h2{color:#2A9D8F;border-bottom-color:#2A9D8F}
.col-concluido h2{color:#264653;border-bottom-color:#264653}
.counter{background:#eee;padding:2px 10px;border-radius:20px;font-size:12px;color:#555}
.col-vazia{font-size:13px;color:#aaa;text-align:center;padding:20px 0;font-weight:300}

.order-card{background:#FDF5E6;border:1px solid rgba(166,108,30,.2);border-radius:12px;padding:14px;
  box-shadow:0 4px 6px rgba(0,0,0,.02);display:flex;flex-direction:column;gap:10px}
.order-card.atrasado{border-color:#E63946;box-shadow:0 0 0 2px rgba(230,57,70,.15)}
.order-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed #ccc;padding-bottom:10px;gap:8px}
.order-id{font-weight:700;color:#A66C1E;font-size:17px}
.order-time{font-size:12px;color:#888;white-space:nowrap}
.order-client strong{display:block;font-size:15px;color:#333}
.order-client p{font-size:13px;color:#666;margin-top:3px;line-height:1.45}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:11px;font-weight:600;padding:4px 9px;border-radius:5px}
.tag-pay{background:#e0f7fa;color:#00838f}
.tag-entrega{background:#fdecef;color:#c1121f}
.tag-retirada{background:#e8f5e9;color:#2e7d32}
.order-items{background:#fff;padding:11px;border-radius:8px;font-size:13px}
.order-items ul{list-style:none;margin-bottom:10px}
.order-items li{margin-bottom:7px;border-bottom:1px solid #f0f0f0;padding-bottom:7px;line-height:1.5}
.order-items li:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.item-sub{display:block;font-size:12px;color:#7a6a52;margin-top:3px;padding-left:12px}
.item-obs{display:block;font-size:12px;color:#c1121f;font-weight:600;margin-top:3px;padding-left:12px}
.order-total{font-weight:700;color:#E63946;font-size:15px;text-align:right}
.order-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-action{flex:1;min-width:120px;padding:13px 10px;border:none;border-radius:8px;font-weight:600;
  cursor:pointer;font-size:12px;transition:.2s;text-align:center;color:#fff}
.btn-action:disabled{opacity:.5;cursor:wait}
.btn-prep{background:#F4A261}.btn-prep:hover{background:#e08c4e}
.btn-env{background:#2A9D8F}.btn-env:hover{background:#21867a}
.btn-conc{background:#264653}.btn-conc:hover{background:#1a333d}
.btn-zap{background:#25D366;flex:0 0 46px;min-width:46px;font-size:16px}
.btn-cancel{background:#fff;color:#E63946;border:1px solid #E63946;flex:0 0 46px;min-width:46px;font-size:15px}
.status-cancelado{background:#f5f5f5;border-color:#ddd;opacity:.65}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:#f1f1f1;border-radius:10px}
::-webkit-scrollbar-thumb{background:#c1c1c1;border-radius:10px}
@media(max-width:820px){.kanban-board{flex-direction:column;overflow-x:visible}
  .kanban-col{max-width:none;flex:0 0 auto}.col-content{max-height:none}}
</style>
</head>
<body>

<div id="login-screen">
  <form class="login-box" id="login-form">
    <h2>🍕 Painel da Cozinha</h2>
    <p class="sub">Acesso restrito à equipe Doce Capricho.</p>
    <label for="email">E-mail</label>
    <input type="email" id="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input type="password" id="senha" autocomplete="current-password" required>
    <button type="submit" id="btn-login">Entrar</button>
    <p class="login-erro" id="login-erro" role="alert"></p>
  </form>
</div>

<header id="topbar" style="display:none">
  <h1>🍕 Painel da Cozinha</h1>
  <div class="header-right">
    <span class="badge-status"><span class="dot" id="conn-dot"></span><span id="conn-text">Atualização automática ativa</span></span>
    <button type="button" class="btn-plain" id="btn-som">🔔 Som: ligado</button>
    <button type="button" class="btn-plain" id="btn-sair">Sair</button>
  </div>
</header>

<div id="painel">
  <div class="kanban-board">
    <div class="kanban-col col-novo">
      <h2>Novos <span class="counter" id="count-Novo">0</span></h2>
      <div class="col-content" id="col-Novo"></div>
    </div>
    <div class="kanban-col col-prep">
      <h2>No Forno <span class="counter" id="count-Preparando">0</span></h2>
      <div class="col-content" id="col-Preparando"></div>
    </div>
    <div class="kanban-col col-entrega">
      <h2>A Caminho <span class="counter" id="count-A Caminho">0</span></h2>
      <div class="col-content" id="col-A Caminho"></div>
    </div>
    <div class="kanban-col col-concluido">
      <h2>Finalizados (hoje) <span class="counter" id="count-Concluido">0</span></h2>
      <div class="col-content" id="col-Concluido"></div>
    </div>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCU5CFz3cbrpyk3dsJBR46m-0km3kYkjJA",
  authDomain: "sistema-doce-capricho.firebaseapp.com",
  projectId: "sistema-doce-capricho",
  storageBucket: "sistema-doce-capricho.firebasestorage.app",
  messagingSenderId: "203794333208",
  appId: "1:203794333208:web:4c4bc82f2ebb6032ab0d6d"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.firestore();
const auth = firebase.auth();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const brl = c => (Number(c || 0) / 100).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
const soDigitos = s => String(s || '').replace(/\D/g, '');

const COLUNAS = ['Novo', 'Preparando', 'A Caminho', 'Concluido'];
const PROXIMO = { 'Novo':'Preparando', 'Preparando':'A Caminho', 'A Caminho':'Concluido' };
const ROTULO  = { 'Preparando':'Aceitar (ir p/ forno)', 'A Caminho':'Enviar p/ entrega', 'Concluido':'Marcar entregue' };
const CLASSE  = { 'Preparando':'btn-prep', 'A Caminho':'btn-env', 'Concluido':'btn-conc' };

let somLigado = true, idsConhecidos = new Set(), primeiraCarga = true, unsub = null;

/* ---------- LOGIN ---------- */
$('#login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('#btn-login'), err = $('#login-erro');
  btn.disabled = true; btn.textContent = 'Entrando...'; err.classList.remove('show');
  try {
    await auth.signInWithEmailAndPassword($('#email').value.trim(), $('#senha').value);
  } catch (ex) {
    err.textContent = (ex.code === 'auth/invalid-credential' || ex.code === 'auth/wrong-password'
      || ex.code === 'auth/user-not-found' || ex.code === 'auth/invalid-email')
      ? 'E-mail ou senha incorretos.'
      : 'Não foi possível entrar. Verifique a conexão. (' + ex.code + ')';
    err.classList.add('show');
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
});

$('#btn-sair').addEventListener('click', () => auth.signOut());
$('#btn-som').addEventListener('click', () => {
  somLigado = !somLigado;
  $('#btn-som').textContent = somLigado ? '🔔 Som: ligado' : '🔕 Som: desligado';
  if (somLigado) beep();
});

auth.onAuthStateChanged(user => {
  if (user) {
    $('#login-screen').style.display = 'none';
    $('#topbar').style.display = 'flex';
    $('#painel').style.display = 'flex';
    $('#senha').value = '';
    if (!unsub) escutarPedidos();
  } else {
    if (unsub) { unsub(); unsub = null; }
    idsConhecidos = new Set(); primeiraCarga = true;
    $('#login-screen').style.display = 'flex';
    $('#topbar').style.display = 'none';
    $('#painel').style.display = 'none';
  }
});

/* ---------- ALERTA SONORO ---------- */
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 260].forEach(atraso => setTimeout(() => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .22);
      o.start(); o.stop(ctx.currentTime + .24);
    }, atraso));
    setTimeout(() => ctx.close(), 900);
  } catch (e) {}
}

/* ---------- TEMPO ---------- */
function hora(ts) {
  if (!ts || !ts.toDate) return '—';
  return ts.toDate().toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}
function minutosDesde(ts) {
  if (!ts || !ts.toDate) return 0;
  return Math.floor((Date.now() - ts.toDate().getTime()) / 60000);
}

/* ---------- ESCUTA EM TEMPO REAL ---------- */
function escutarPedidos() {
  unsub = db.collection('pedidos')
    .orderBy('data_pedido', 'desc')
    .limit(80)
    .onSnapshot(snap => {
      $('#conn-dot').classList.remove('off');
      $('#conn-text').textContent = 'Atualização automática ativa';

      const inicioDoDia = new Date(); inicioDoDia.setHours(0, 0, 0, 0);
      const grupos = { 'Novo':[], 'Preparando':[], 'A Caminho':[], 'Concluido':[] };
      let novoChegou = false;

      snap.forEach(doc => {
        const p = doc.data() || {};
        const status = COLUNAS.includes(p.status) ? p.status : 'Novo';
        if (p.status === 'Cancelado') return;

        /* Finalizados: só os de hoje, para o quadro não virar arquivo morto */
        if (status === 'Concluido') {
          const d = p.data_pedido && p.data_pedido.toDate ? p.data_pedido.toDate() : null;
          if (d && d < inicioDoDia) return;
        }
        if (status === 'Novo' && !idsConhecidos.has(doc.id) && !primeiraCarga) novoChegou = true;
        idsConhecidos.add(doc.id);
        grupos[status].push({ id: doc.id, ...p });
      });

      /* Fila de produção na ordem de chegada (mais antigo primeiro) */
      ['Novo', 'Preparando', 'A Caminho'].forEach(k => grupos[k].reverse());

      COLUNAS.forEach(status => {
        const alvo = document.getElementById('col-' + status);
        alvo.innerHTML = grupos[status].length
          ? grupos[status].map(cardHTML).join('')
          : '<p class="col-vazia">Nenhum pedido</p>';
        document.getElementById('count-' + status).textContent = grupos[status].length;
      });

      if (novoChegou && somLigado) beep();
      primeiraCarga = false;
    }, err => {
      console.error(err);
      $('#conn-dot').classList.add('off');
      $('#conn-text').textContent = 'Sem conexão com o banco';
    });
}

/* ---------- CARD ---------- */
function cardHTML(p) {
  const cod = '#' + p.id.slice(-5).toUpperCase();
  const status = COLUNAS.includes(p.status) ? p.status : 'Novo';
  const atrasado = status !== 'Concluido' && minutosDesde(p.data_pedido) >= 45;
  const entrega = p.tipo_entrega !== 'Retirada';

  const itens = Array.isArray(p.itens) && p.itens.length
    ? p.itens.map(i => {
        const extras = Array.isArray(i.extras) && i.extras.length
          ? `<span class="item-sub">+ ${i.extras.map(e => esc(e.nome) + ' (' + esc(e.aplicacao) + ')').join(' · ')}</span>` : '';
        const obs = i.obs ? `<span class="item-obs">⚠ ${esc(i.obs)}</span>` : '';
        return `<li><strong>${esc(i.qtd || 1)}×</strong> ${esc(i.nome || 'Item')}${extras}${obs}</li>`;
      }).join('')
    : '<li>Pedido sem itens registrados</li>';

  const prox = PROXIMO[status];
  const acoes = [];
  if (prox) acoes.push(`<button class="btn-action ${CLASSE[prox]}" data-avancar="${p.id}" data-para="${prox}">${ROTULO[prox]}</button>`);
  if (p.cliente_telefone) acoes.push(`<button class="btn-action btn-zap" data-zap="${p.id}" title="Abrir WhatsApp do cliente">💬</button>`);
  if (status === 'Novo') acoes.push(`<button class="btn-action btn-cancel" data-cancelar="${p.id}" title="Cancelar pedido">✕</button>`);

  return `<div class="order-card${atrasado ? ' atrasado' : ''}" data-id="${p.id}">
    <div class="order-header">
      <span class="order-id">${cod}</span>
      <span class="order-time">⏳ ${hora(p.data_pedido)}${atrasado ? ' · ' + minutosDesde(p.data_pedido) + 'min' : ''}</span>
    </div>
    <div class="order-client">
      <strong>👤 ${esc(p.cliente_nome || 'Cliente')}</strong>
      <p>📞 ${esc(p.cliente_telefone || 'não informado')}</p>
      ${entrega ? `<p>📍 ${esc(p.cliente_endereco || 'endereço não informado')}</p>` : ''}
      <div class="tags">
        <span class="tag ${entrega ? 'tag-entrega' : 'tag-retirada'}">${entrega ? '🛵 Entrega' : '🏠 Retirada'}</span>
        <span class="tag tag-pay">💳 ${esc(p.forma_pagamento || '—')}</span>
      </div>
    </div>
    <div class="order-items">
      <ul>${itens}</ul>
      <div class="order-total">Total: ${brl(p.total_centavos)}</div>
    </div>
    ${acoes.length ? `<div class="order-actions">${acoes.join('')}</div>` : ''}
  </div>`;
}

/* ---------- AÇÕES (delegação, sem onclick inline) ---------- */
$('#painel').addEventListener('click', async e => {
  const av = e.target.closest('[data-avancar]');
  const zp = e.target.closest('[data-zap]');
  const cc = e.target.closest('[data-cancelar]');

  if (zp) return abrirWhats(zp.dataset.zap);

  if (cc) {
    if (!confirm('Cancelar este pedido? Ele sairá do quadro.')) return;
    try { await atualizar(cc.dataset.cancelar, 'Cancelado'); }
    catch (ex) { alert('Erro ao cancelar: ' + ex.message); }
    return;
  }

  if (!av) return;
  const { avancar: id, para } = av.dataset;
  av.disabled = true;

  /* Aba aberta ANTES do await: o iPad bloqueia popup depois de operação assíncrona */
  let aba = null;
  const dados = dadosDoCard(id);
  if (para === 'A Caminho' && dados && dados.tel) aba = window.open('about:blank', '_blank');

  try {
    await atualizar(id, para);
    if (aba && dados) {
      const msg = `Olá, ${dados.nome}! 🛵 Seu pedido da Doce Capricho (#${id.slice(-5).toUpperCase()}) saiu do forno e já está a caminho!`;
      aba.location.href = `https://wa.me/${normalizarTelefone(dados.tel)}?text=${encodeURIComponent(msg)}`;
    }
  } catch (ex) {
    if (aba) aba.close();
    av.disabled = false;
    alert('Não foi possível atualizar o pedido: ' + ex.message);
  }
});

function atualizar(id, status) {
  return db.collection('pedidos').doc(id).update({
    status,
    atualizado_em: firebase.firestore.FieldValue.serverTimestamp()
  });
}

/* Lê nome/telefone do próprio card já renderizado — evita ida extra ao banco */
function dadosDoCard(id) {
  const card = document.querySelector(`.order-card[data-id="${id}"]`);
  if (!card) return null;
  const nome = (card.querySelector('.order-client strong')?.textContent || '').replace('👤', '').trim();
  const tel = soDigitos(card.querySelector('.order-client p')?.textContent || '');
  return { nome: nome || 'cliente', tel };
}

async function abrirWhats(id) {
  const d = dadosDoCard(id);
  if (!d || !d.tel) return alert('Este pedido não tem telefone registrado.');
  window.open(`https://wa.me/${normalizarTelefone(d.tel)}`, '_blank');
}

/* 10 ou 11 dígitos = número nacional, acrescenta 55.
   Não usa startsWith('55'): 55 também é DDD (Santa Maria/RS). */
function normalizarTelefone(tel) {
  const d = soDigitos(tel);
  if (d.length === 10 || d.length === 11) return '55' + d;
  return d;
}
</script>
</body>
</html>
